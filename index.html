    map[y]=[];oreMap[y]=[];buildMap[y]=[];
    for(let x=0;x<MAP_SIZE;x++){
      map[y][x]=BLOCK.DIRT;oreMap[y][x]=ORE.NONE;buildMap[y][x]=null;
    }
  }
  // walls border
  for(let i=0;i<MAP_SIZE;i++){map[0][i]=map[MAP_SIZE-1][i]=map[i][0]=map[i][MAP_SIZE-1]=BLOCK.WALL}
  // fertile patches
  for(let f=0;f<40;f++){
    const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),r=3+Math.floor(Math.random()*5);
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;
      if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random()*1.2)map[y][x]=BLOCK.FERTILE;
    }
  }
  // water
  for(let w=0;w<12;w++){
    const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),r=2+Math.floor(Math.random()*4);
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;
      if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random())map[y][x]=BLOCK.WATER;
    }
  }
  // hot tiles
  for(let h=0;h<8+Math.random()*6;h++){
    const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),r=2+Math.floor(Math.random()*4);
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;
      if(map[y][x]===BLOCK.WATER||map[y][x]===BLOCK.WALL)continue;
      if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random()*1.5)map[y][x]=BLOCK.HOT;
    }
  }
  // core
  core.x=Math.floor(MAP_SIZE/2);core.y=Math.floor(MAP_SIZE/2);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    map[core.y+dy][core.x+dx]=BLOCK.CORE;
  }
  // ores clusters
  const oreTypes=[
    {type:ORE.COPPER,count:18,minR:2,maxR:5},
    {type:ORE.LEAD,count:14,minR:2,maxR:4},
    {type:ORE.COAL,count:12,minR:2,maxR:4},
    {type:ORE.SAND,count:20,minR:2,maxR:6},
    {type:ORE.TITANIUM,count:8,minR:1,maxR:3},
    {type:ORE.THORIUM,count:5,minR:1,maxR:2},
    {type:ORE.METALOM,count:6,minR:1,maxR:3}
  ];
  const centers=[];
  for(const ore of oreTypes){
    let pl=0,att=0;
    while(pl<ore.count&&att<ore.count*30){
      att++;
      const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20));
      const radius=ore.minR+Math.floor(Math.random()*(ore.maxR-ore.minR+1));
      if(centers.some(p=>Math.sqrt((cx-p.x)**2+(cy-p.y)**2)<radius+p.r+3))continue;
      if(Math.abs(cx-core.x)<radius+3&&Math.abs(cy-core.y)<radius+3)continue;
      let free=0,tot=0;
      for(let y=cy-radius;y<=cy+radius;y++)for(let x=cx-radius;x<=cx+radius;x++){
        if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;
        if(Math.sqrt((x-cx)**2+(y-cy)**2)>radius)continue;
        tot++;
        if(oreMap[y][x]===ORE.NONE&&(map[y][x]===BLOCK.DIRT||map[y][x]===BLOCK.FERTILE||map[y][x]===BLOCK.HOT))free++;
      }
      if(tot===0||free/tot<.5)continue;
      for(let y=cy-radius;y<=cy+radius;y++)for(let x=cx-radius;x<=cx+radius;x++){
        if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;
        if(map[y][x]===BLOCK.WATER||map[y][x]===BLOCK.WALL||map[y][x]===BLOCK.CORE)continue;
        if(oreMap[y][x]!==ORE.NONE)continue;
        if(Math.sqrt((x-cx)**2+(y-cy)**2)<radius-Math.random()*1.8)oreMap[y][x]=ore.type;
      }
      centers.push({x:cx,y:cy,r:radius});pl++;
    }
  }
  RESOURCES.forEach(r=>coreInventory[r.id]=0);shipCargo.type=null;shipCargo.amount=0;
}

  ship.x=core.x+2;ship.y=core.y;ship.vx=0;ship.vy=0;ship.angle=0;
  camera.x=ship.x*TILE-VIEW_W/2;camera.y=ship.y*TILE-VIEW_H/2;

// === INPUT ===
let pointers=new Map();
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()});
  menuDown=true;
  handlePointerDown(e.clientX,e.clientY);
});
canvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  const p=pointers.get(e.pointerId);if(!p)return;
  p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===1&&Math.hypot(p.x-p.sx,p.y-p.sy)>8){
    // pan camera
    camera.x-=(p.x-p.sx)*(VIEW_W/canvas.clientWidth);
    camera.y-=(p.y-p.sy)*(VIEW_H/canvas.clientHeight);
    p.sx=p.x;p.sy=p.y;
  }
});
canvas.addEventListener('pointerup',e=>{
  e.preventDefault();
  const p=pointers.get(e.pointerId);if(!p)return;
  pointers.delete(e.pointerId);
  if(Math.hypot(p.x-p.sx,p.y-p.sy)<10&&performance.now()-p.t<300){
    handlePointerUp(e.clientX,e.clientY);
  }
  menuDown=false;
});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);menuDown=false});

window.addEventListener('keydown',e=>{
  if(e.code==='KeyR'){selectedDir=(selectedDir+1)%4;if(ghosts.length)ghosts[ghosts.length-1].dir=selectedDir}
  if(e.code==='Escape'){ghosts=[];deleteSel.clear();showBlockInfo=false}
  if(e.code==='KeyQ')showBlockInfo=!showBlockInfo;
});

function screenToTile(sx,sy){
  const rect=canvas.getBoundingClientRect();
  const x=(sx-rect.left)*(VIEW_W/rect.width)+camera.x;
  const y=(sy-rect.top)*(VIEW_H/rect.height)+camera.y;
  return {x:Math.floor(x/TILE),y:Math.floor(y/TILE)};
}

function handlePointerDown(sx,sy){
  const hit=hitTestUI(sx,sy);
  if(hit){
    if(hit.type==='mode'){
      if(buildMode==='place'){buildMode='delete';/* ghosts stay */}
      else{buildMode='place';deleteSel.clear()}
      return;
    }
    if(hit.type==='cat'){
      if(hit.cat.blocks.length){selectedBlock=hit.cat.blocks[0];buildMode='place';deleteSel.clear()}
      return;
    }
    if(hit.type==='block'){
      selectedBlock=hit.block;buildMode='place';selectedDir=DIR.RIGHT;deleteSel.clear();showBlockInfo=false;
      return;
    }
    if(hit.type==='confirm'){
      if(buildMode==='place'&&ghosts.length){
        for(const g of ghosts)placeBuilding(g.x,g.y,g.type,g.dir);
        ghosts=[];
      }else if(buildMode==='delete'&&deleteSel.size){
        for(const key of deleteSel){
          const [x,y]=key.split(',').map(Number);
          removeBuilding(x,y);
        }
        deleteSel.clear();
      }
      return;
    }
    if(hit.type==='info'){
      showBlockInfo=!showBlockInfo;
      return;
    }
  }
  // Always allow removing ghosts by clicking them
  const tile=screenToTile(sx,sy);
  if(tryRemoveGhost(tile.x,tile.y))return;
}

function handlePointerUp(sx,sy){
  const hit=hitTestUI(sx,sy);
  if(hit)return;
  const tile=screenToTile(sx,sy);
  if(tile.x<0||tile.y<0||tile.x>=MAP_SIZE||tile.y>=MAP_SIZE)return;
  if(buildMode==='delete'){
    toggleDeleteSel(tile.x,tile.y);
    return;
  }
  if(buildMode==='place'&&selectedBlock){
    if(!canPlace(tile.x,tile.y,selectedBlock))return;
    ghosts.push({x:tile.x,y:tile.y,type:selectedBlock,dir:selectedDir});
  }
}

function tryRemoveGhost(tx,ty){
  for(let i=ghosts.length-1;i>=0;i--){
    const g=ghosts[i];const s=BUILDING_DEFS[g.type]?.size||1;
    if(tx>=g.x&&tx<g.x+s&&ty>=g.y&&ty<g.y+s){ghosts.splice(i,1);return true}
  }
  return false;
}

function toggleDeleteSel(tx,ty){
  const key=getMainBuildingKey(tx,ty);
  if(!key)return;
  if(deleteSel.has(key))deleteSel.delete(key);
  else deleteSel.add(key);
}

function getMainBuildingKey(tx,ty){
  const b=buildMap[ty]?.[tx];
  if(!b)return null;
  if(b.type==='part')return b.parentX+','+b.parentY;
  return tx+','+ty;
}

function hasPending(){return ghosts.length>0||deleteSel.size>0}

function hitTestUI(sx,sy){
  const rect=canvas.getBoundingClientRect();
  const x=(sx-rect.left)*(VIEW_W/rect.width);
  const y=(sy-rect.top)*(VIEW_H/rect.height);
  // mode button
  if(x>VIEW_W/2-70&&x<VIEW_W/2+70&&y>8&&y<30)return {type:'mode'};
  // confirm
  if(hasPending()&&x>VIEW_W/2-110&&x<VIEW_W/2+110&&y>34&&y<52)return {type:'confirm'};
  // build menu left
  const menuW=180,menuH=VIEW_H-120,menuX=8,menuY=40;
  if(x>=menuX&&x<=menuX+menuW&&y>=menuY&&y<=menuY+menuH){
    // categories
    const catH=28;
    for(let i=0;i<CATEGORIES.length;i++){
      if(y>=menuY+i*catH&&y<menuY+(i+1)*catH)return {type:'cat',cat:CATEGORIES[i]};
    }
    // blocks of current category (simplified: use selected)
    const cat=CATEGORIES.find(c=>c.blocks.includes(selectedBlock))||CATEGORIES[0];
    const startY=menuY+CATEGORIES.length*catH+4;
    const blockH=32;
    for(let i=0;i<cat.blocks.length;i++){
      const by=startY+i*blockH-menuScroll;
      if(y>=by&&y<by+blockH)return {type:'block',block:cat.blocks[i]};
    }
  }
  return null;
}

// === BUILDING PLACEMENT ===
function canPlace(x,y,type){
  const def=BUILDING_DEFS[type];if(!def)return false;
  for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++){
    const tx=x+dx,ty=y+dy;
    if(tx<0||ty<0||tx>=MAP_SIZE||ty>=MAP_SIZE)return false;
    if(map[ty][tx]===BLOCK.WALL||map[ty][tx]===BLOCK.CORE)return false;
    if(buildMap[ty][tx])return false;
  }
  return true;
}

function placeBuilding(x,y,type,dir=0){
  if(!canPlace(x,y,type))return;
  const def=BUILDING_DEFS[type];
  const b={type,dir,items:{},liquids:{},progress:0,power:0,timer:0};
  for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++){
    if(dx===0&&dy===0)buildMap[y][x]=b;
    else buildMap[y+dy][x+dx]={type:'part',parentX:x,parentY:y};
  }
}

function removeBuilding(x,y){
  const b=buildMap[y]?.[x];
  if(!b)return;
  let px=x,py=y;
  if(b.type==='part'){px=b.parentX;py=b.parentY}
  const def=BUILDING_DEFS[buildMap[py][px].type];
  if(!def)return;
  for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++){
    buildMap[py+dy][px+dx]=null;
  }
}

// === SIMULATION HELPERS ===
function countCoverage(x,y,size,pred){
  let n=0,tot=size*size;
  for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
    if(pred(x+dx,y+dy))n++;
  }
  return {n,ratio:n/tot,tot};
}

function addItem(b,id,amt){
  if(!b.items)b.items={};
  const def=BUILDING_DEFS[b.type];
  const cur=Object.values(b.items).reduce((a,v)=>a+v,0);
  const space=(def.itemCap||10)-cur;
  const add=Math.min(space,amt);
  if(add>0)b.items[id]=(b.items[id]||0)+add;
  return add;
}

function takeItem(b,id,amt){
  if(!b.items||!b.items[id])return 0;
  const t=Math.min(b.items[id],amt);
  b.items[id]-=t;
  if(b.items[id]<=0)delete b.items[id];
  return t;
}

function addLiquid(b,id,amt){
  if(!b.liquids)b.liquids={};
  const def=BUILDING_DEFS[b.type];
  const cur=Object.values(b.liquids||{}).reduce((a,v)=>a+v,0);
  const space=(def.liqCap||60)-cur;
  const add=Math.min(space,amt);
  if(add>0){if(!b.liquids)b.liquids={};b.liquids[id]=(b.liquids[id]||0)+add}
  return add;
}

function takeLiquid(b,id,amt){
  if(!b.liquids)return 0;
  const have=b.liquids[id]||0;
  const t=Math.min(have,amt);
  if(t>0){b.liquids[id]-=t;if(b.liquids[id]<=0)delete b.liquids[id]}
  return t;
}

// === UPDATE ===
function updateBuildings(dt){
  globalPowerGen=0;globalPowerUse=0;globalPowerCap=0;
  let powerNeed=0,powerHave=0;
  // first pass: collect generation and capacity
  for(let y=0;y<MAP_SIZE;y++)for(let x=0;x<MAP_SIZE;x++){
    const b=buildMap[y][x];if(!b||b.type==='part')continue;
    const def=BUILDING_DEFS[b.type];if(!def)continue;
    if(def.powerCap)globalPowerCap+=def.powerCap;
    // generation
    if(b.type===BTYPE.THERMAL_GEN){
      const hot=countCoverage(x,y,def.size,(tx,ty)=>map[ty][tx]===BLOCK.HOT);
      if(hot.n>0){const gen=108*hot.ratio;globalPowerGen+=gen;b._gen=gen}
    }else if(b.type===BTYPE.SOLAR||b.type===BTYPE.LARGE_SOLAR){
      const gen=def.powerGen*Math.max(0,Math.sin(dayNight*Math.PI));
      globalPowerGen+=gen;b._gen=gen;
    }else if(def.powerGen&&!def.fuels&&!def.recipe){
      // static or simple
    }
  }
  // second pass: consume and produce
  for(let y=0;y<MAP_SIZE;y++)for(let x=0;x<MAP_SIZE;x++){
    const b=buildMap[y][x];if(!b||b.type==='part')continue;
    const def=BUILDING_DEFS[b.type];if(!def)continue;
    // drills
    if(def.mine){
      let rateMul=1;
      if(def.boostWater&&(b.liquids?.water||0)>=def.boostWater*dt){
        takeLiquid(b,'water',def.boostWater*dt);
        rateMul=def.boostMul||2.56;
      }
      if(def.powerUse){
        // simplified power check
        globalPowerUse+=def.powerUse;
      }
      for(const [res,baseRate] of Object.entries(def.mine)){
        const oreId=Object.keys(ORE_TO_ID).find(k=>ORE_TO_ID[k]===res);
        if(oreId===undefined)continue;
        const cov=countCoverage(x,y,def.size,(tx,ty)=>oreMap[ty][tx]==+oreId);
        if(cov.n===0)continue;
        const rate=baseRate*cov.ratio*rateMul;
        const amt=rate*dt;
        if(amt>0)addItem(b,res,amt);
      }
    }
    // pumps
    if(def.pumpRate){
      if(def.powerUse)globalPowerUse+=def.powerUse;
      const waterCov=countCoverage(x,y,def.size,(tx,ty)=>map[ty][tx]===BLOCK.WATER);
      if(waterCov.n>0){
        const rate=def.pumpRate*waterCov.ratio;
        addLiquid(b,'water',rate*dt);
      }
    }
    // water extractor
    if(b.type===BTYPE.WATER_EXTRACTOR){
      globalPowerUse+=90;
      const fert=countCoverage(x,y,def.size,(tx,ty)=>map[ty][tx]===BLOCK.FERTILE);
      if(fert.n>0)addLiquid(b,'water',6.6*fert.ratio*dt);
    }
    // oil extractor
    if(b.type===BTYPE.OIL_EXTRACTOR){
      globalPowerUse+=180;
      const fert=countCoverage(x,y,def.size,(tx,ty)=>map[ty][tx]===BLOCK.FERTILE);
      if(fert.n>0&&(b.items.sand||0)>=1&&(b.liquids?.water||0)>=9*dt){
        takeItem(b,'sand',1*dt);
        takeLiquid(b,'water',9*dt);
        addLiquid(b,'oil',15*dt);
      }
    }
    // cultivator
    if(b.type===BTYPE.CULTIVATOR){
      globalPowerUse+=80;
      if((b.liquids?.water||0)>=18*dt){
        takeLiquid(b,'water',18*dt);
        b.progress=(b.progress||0)+dt;
        if(b.progress>=1.666){b.progress-=1.666;addItem(b,'spore',1)}
      }
    }
    // combustion gen
    if(b.type===BTYPE.COMBUSTION){
      let fuelId=null,eff=0;
      for(const [f,e] of Object.entries(def.fuels||{})){
        if((b.items[f]||0)>0){fuelId=f;eff=e;break}
      }
      if(fuelId){
        takeItem(b,fuelId,0.1*dt); // approximate burn
        globalPowerGen+=60*eff;
      }
    }
    // steam gen
    if(b.type===BTYPE.STEAM_GEN){
      let fuelId=null;
      for(const f of ['coal','spore','pyratite'])if((b.items[f]||0)>0){fuelId=f;break}
      if(fuelId&&(b.liquids?.water||0)>=6*dt){
        takeLiquid(b,'water',6*dt);
        takeItem(b,fuelId,0.1*dt);
        globalPowerGen+=330;
      }
    }
    // diff gen
    if(b.type===BTYPE.DIFF_GEN){
      if((b.items.pyratite||0)>=1&&(b.liquids?.cryo||0)>=6*dt){
        takeItem(b,'pyratite',1*dt);
        takeLiquid(b,'cryo',6*dt);
        globalPowerGen+=1080;
      }
    }
    // RTG
    if(b.type===BTYPE.RTG){
      if((b.items.thorium||0)>0){takeItem(b,'thorium',0.05*dt);globalPowerGen+=270}
      else if((b.items.phase||0)>0){takeItem(b,'phase',0.05*dt);globalPowerGen+=270*0.6*15}
    }
    // thorium reactor
    if(b.type===BTYPE.THORIUM_REACTOR){
      const cryo=b.liquids?.cryo||0;
      if((b.items.thorium||0)>=1&&cryo>=2.4*dt){
        takeItem(b,'thorium',1*dt);
        takeLiquid(b,'cryo',2.4*dt);
        globalPowerGen+=900;
        b.timer=0;
      }else if((b.items.thorium||0)>=30&&cryo<=0){
        b.timer=(b.timer||0)+dt;
        if(b.timer>3.54){
          // explode
          removeBuilding(x,y);
          // damage area simplified
        }
      }
    }
    // impact reactor
    if(b.type===BTYPE.IMPACT_REACTOR){
      globalPowerUse+=1500;
      if((b.liquids?.cryo||0)>=15*dt&&(b.items.blast||0)>=1){
        takeLiquid(b,'cryo',15*dt);
        takeItem(b,'blast',1*dt);
        globalPowerGen+=7800;
      }
    }
    // recipes
    if(def.recipe){
      if(def.powerUse)globalPowerUse+=def.powerUse;
      let can=true;
      for(const [id,need] of Object.entries(def.recipe.in)){
        const isLiq=RESOURCES.find(r=>r.id===id)?.liquid;
        if(isLiq){if((b.liquids?.[id]||0)<need*dt*0.5&&(b.liquids?.[id]||0)<need)can=false}
        else if((b.items[id]||0)<need)can=false;
      }
      if(can){
        b.progress=(b.progress||0)+dt;
        if(b.progress>=def.recipe.time){
          b.progress-=def.recipe.time;
          for(const [id,need] of Object.entries(def.recipe.in)){
            const isLiq=RESOURCES.find(r=>r.id===id)?.liquid;
            if(isLiq)takeLiquid(b,id,need);
            else takeItem(b,id,need);
          }
          for(const [id,out] of Object.entries(def.recipe.out)){
            const isLiq=RESOURCES.find(r=>r.id===id)?.liquid;
            if(isLiq)addLiquid(b,id,out);
            else addItem(b,id,out);
          }
        }
      }
    }
    // separator simplified
    if(b.type===BTYPE.SEPARATOR){
      globalPowerUse+=66;
      if((b.liquids?.slag||0)>=4*dt){
        takeLiquid(b,'slag',4*dt);
        const roll=Math.random();
        if(roll<0.41)addItem(b,Math.random()<0.5?'copper':'lead',1);
        else if(roll<0.57)addItem(b,Math.random()<0.5?'graphite':'titanium',1);
      }
    }
  }
  // simple power balance
  globalPower=Math.min(globalPowerCap,Math.max(0,globalPower+(globalPowerGen-globalPowerUse)*dt));
}

function updateItems(dt){
  // simplified item movement on conveyors
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    const tx=Math.floor(it.x),ty=Math.floor(it.y);
    const b=buildMap[ty]?.[tx];
    if(b&&b.type!=='part'){
      const def=BUILDING_DEFS[b.type];
      if(def&&def.speed){
        const v=DIR_VEC[b.dir??0];
        it.x+=v.x*def.speed*60*dt;
        it.y+=v.y*def.speed*60*dt;
        // check if left the tile
        if(Math.floor(it.x)!==tx||Math.floor(it.y)!==ty){
          // try enter next
        }
      }
    }
  }
}

// === DRAW ===
function drawIcon(x,y,size,type,color){
  ctx.fillStyle=color;
  if(type==='liquid'){ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.fill()}
  else{ctx.fillRect(x-size/2,y-size/2,size,size)}
}

function drawDirArrow(cx,cy,d,alpha=1){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(d*Math.PI/2);ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawBuildMenu(){
  const menuW=180,menuX=8,menuY=40,catH=28;
  ctx.fillStyle='rgba(10,12,20,0.92)';ctx.fillRect(menuX,menuY,menuW,VIEW_H-120);
  ctx.strokeStyle='#446';ctx.strokeRect(menuX,menuY,menuW,VIEW_H-120);
  CATEGORIES.forEach((cat,i)=>{
    const selected=cat.blocks.includes(selectedBlock);
    ctx.fillStyle=selected?'#2a4060':'#1a2030';
    ctx.fillRect(menuX+2,menuY+i*catH+2,menuW-4,catH-2);
    ctx.fillStyle=selected?'#8cf':'#aaa';ctx.font='12px system-ui';ctx.fillText(cat.name,menuX+8,menuY+i*catH+18);
  });
  const cat=CATEGORIES.find(c=>c.blocks.includes(selectedBlock))||CATEGORIES[0];
  const startY=menuY+CATEGORIES.length*catH+8;
  cat.blocks.forEach((bt,i)=>{
    const def=BUILDING_DEFS[bt];if(!def)return;
    const by=startY+i*32;
    if(by>VIEW_H-100)return;
    const sel=selectedBlock===bt;
    ctx.fillStyle=sel?'#3a5080':'#1a2535';
    ctx.fillRect(menuX+4,by,menuW-8,30);
    ctx.fillStyle=def.color;ctx.fillRect(menuX+8,by+6,18,18);
    ctx.fillStyle=sel?'#fff':'#ccc';ctx.font='11px system-ui';ctx.fillText(def.name,menuX+32,by+18);
  });
}

function drawBlockInfo(){
  if(!showBlockInfo||!selectedBlock)return;
  const def=BUILDING_DEFS[selectedBlock];if(!def)return;
  const lines=[def.name,def.desc||''];
  if(def.size)lines.push(`Размер: ${def.size}x${def.size}`);
  if(def.itemCap)lines.push(`Предметы: ${def.itemCap}`);
  if(def.liqCap)lines.push(`Жидкости: ${def.liqCap}`);
  if(def.powerUse)lines.push(`Энергия: -${def.powerUse}/с`);
  if(def.powerGen)lines.push(`Генерация: +${def.powerGen}/с`);
  if(def.powerCap)lines.push(`Ёмкость энергии: ${def.powerCap}`);
  if(def.mine)lines.push('Добыча: '+Object.entries(def.mine).map(([k,v])=>k+':'+v).join(', '));
  if(def.recipe)lines.push('Рецепт: '+JSON.stringify(def.recipe.in)+' → '+JSON.stringify(def.recipe.out)+' /'+def.recipe.time+'с');
  if(def.pumpRate)lines.push(`Насос: ${def.pumpRate}/с`);
  if(def.boostWater)lines.push(`Буст водой: x${def.boostMul} (${def.boostWater}/с)`);
  const w=Math.min(320,VIEW_W-20),pad=8;
  const h=lines.length*16+pad*2;
  const px=12,py=50;
  ctx.fillStyle='rgba(15,15,30,.95)';ctx.fillRect(px,py,w,h);
  ctx.strokeStyle='#6ab0ff';ctx.strokeRect(px,py,w,h);
  ctx.font='11px system-ui';
  lines.forEach((ln,i)=>{
    ctx.fillStyle=i===0?'#ffcc66':i===1?'#aaa':'#ccc';
    ctx.fillText(ln.slice(0,50),px+pad,py+pad+12+i*16);
  });
}

function drawCoreInv(){
  if(!showCoreInv)return;
  const panelW=Math.min(220,VIEW_W*.42),rowH=22,pad=8,titleH=20;
  const coreItems=RESOURCES.filter(r=>(coreInventory[r.id]||0)>0);
  const coreH=titleH+Math.max(1,coreItems.length)*rowH+pad*2;
  const sx=core.x*TILE-camera.x,sy=core.y*TILE-camera.y;
  let px=sx+30,py=sy-coreH/2;
  if(px+panelW>VIEW_W-10)px=sx-panelW-10;
  if(py<50)py=50;if(py+coreH>VIEW_H-120)py=VIEW_H-120-coreH;
  ctx.fillStyle='rgba(15,15,25,.92)';ctx.fillRect(px,py,panelW,coreH);
  ctx.strokeStyle='rgba(100,180,255,.6)';ctx.lineWidth=1.5;ctx.strokeRect(px,py,panelW,coreH);
  ctx.fillStyle='#6ab0ff';ctx.font='bold 11px system-ui';ctx.fillText('ЯДРО',px+pad,py+14);
  if(!coreItems.length){ctx.fillStyle='#555';ctx.font='10px system-ui';ctx.fillText('пусто',px+pad,py+titleH+12)}
  else coreItems.forEach((res,i)=>{const ry=py+titleH+pad+i*rowH;drawIcon(px+pad+8,ry+rowH/2-1,11,res.icon,res.color);ctx.fillStyle='#ccc';ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText(res.name,px+pad+20,ry+13);ctx.fillStyle=res.liquid?'#6ef':'#8cf';ctx.textAlign='right';ctx.fillText(String(Math.floor(coreInventory[res.id])),px+panelW-pad,ry+13);ctx.textAlign='left'});
}

function drawLiquidCounters(){
  // Always-visible counters for key liquids (slag, oil, cryo) + water
  const liqs = ['water','slag','oil','cryo'];
  const labels = {water:'Вода',slag:'Шлак',oil:'Нефть',cryo:'Крио'};
  const colors = {water:'#4da6ff',slag:'#ff6a00',oil:'#8b5a2b',cryo:'#6ef0ff'};
  const startX = 8, startY = 8, h = 18, gap = 4;
  let x = startX;
  ctx.font = '11px system-ui';
  for(const id of liqs){
    const val = Math.floor(coreInventory[id] || 0);
    const label = labels[id] + ': ' + val;
    const w = ctx.measureText(label).width + 16;
    ctx.fillStyle = 'rgba(10,12,20,0.85)';
    ctx.fillRect(x, startY, w, h);
    ctx.strokeStyle = colors[id];
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, startY + 0.5, w - 1, h - 1);
    ctx.fillStyle = colors[id];
    ctx.fillText(label, x + 8, startY + 13);
    x += w + gap;
  }
}

function draw(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const sTX=Math.max(0,Math.floor(camera.x/TILE)-1),sTY=Math.max(0,Math.floor(camera.y/TILE)-1);
  const eTX=Math.min(MAP_SIZE,Math.ceil((camera.x+VIEW_W)/TILE)+1),eTY=Math.min(MAP_SIZE,Math.ceil((camera.y+VIEW_H)/TILE)+1);

  for(let y=sTY;y<eTY;y++)for(let x=sTX;x<eTX;x++){
    const type=map[y][x],ore=oreMap[y][x],sx=x*TILE-camera.x,sy=y*TILE-camera.y;
    if(type===BLOCK.CORE){
      ctx.fillStyle='#1a1a2e';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      ctx.fillStyle='#3a3a5c';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
      if(x===core.x&&y===core.y){ctx.fillStyle='#6ab0ff';ctx.beginPath();ctx.arc(sx+TILE/2,sy+TILE/2,4,0,Math.PI*2);ctx.fill()}
    }else if(type===BLOCK.HOT){
      ctx.fillStyle='#c44a1a';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      ctx.fillStyle='rgba(255,100,0,.3)';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
    }else{
      ctx.fillStyle=COLORS[type]||'#333';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      if(type===BLOCK.FERTILE){ctx.fillStyle='rgba(80,120,40,.2)';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4)}
      if(type===BLOCK.WATER){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(sx+3,sy+3,4,4)}
    }
    if(ore!==ORE.NONE){ctx.fillStyle=ORE_COLORS[ore];ctx.globalAlpha=.85;ctx.fillRect(sx+1,sy+1,TILE-2,TILE-2);ctx.globalAlpha=1}

    const b=buildMap[y][x];
    if(b&&b.type!=='part'){
      const def=BUILDING_DEFS[b.type];
      if(def){
        ctx.fillStyle=def.color;ctx.globalAlpha=.9;
        ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.globalAlpha=1;
        if(def.directional)drawDirArrow(sx+TILE*def.size/2,sy+TILE*def.size/2,b.dir??0);
        const key=x+','+y;
        if(deleteSel.has(key)){
          ctx.strokeStyle='#ff2222';ctx.lineWidth=3;ctx.strokeRect(sx+.5,sy+.5,TILE*def.size-1,TILE*def.size-1);
          ctx.fillStyle='rgba(255,40,40,.25)';ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);
        }
        // item indicator
        const itemCount=Object.values(b.items||{}).reduce((a,v)=>a+v,0);
        if(itemCount>0){ctx.fillStyle='#fff';ctx.font='9px system-ui';ctx.fillText(String(itemCount),sx+2,sy+10)}
      }
    }else if(b&&b.type==='part'){
      const key=b.parentX+','+b.parentY;
      if(deleteSel.has(key)){ctx.strokeStyle='#ff2222';ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,TILE-2,TILE-2);ctx.fillStyle='rgba(255,40,40,.2)';ctx.fillRect(sx+1,sy+1,TILE-2,TILE-2)}
    }
  }

  for(const g of ghosts){
    const def=BUILDING_DEFS[g.type];if(!def)continue;
    const sx=g.x*TILE-camera.x,sy=g.y*TILE-camera.y;
    ctx.fillStyle=def.color;ctx.globalAlpha=.4;ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.globalAlpha=1;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.strokeRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.setLineDash([]);
    if(def.directional)drawDirArrow(sx+TILE*def.size/2,sy+TILE*def.size/2,g.dir,.9);
  }

  for(const it of items){
    const res=RESOURCES.find(r=>r.id===it.type);if(!res)continue;
    ctx.fillStyle=res.color;ctx.beginPath();ctx.arc(it.x*TILE-camera.x,it.y*TILE-camera.y,4,0,Math.PI*2);ctx.fill();
  }

  const ssx=ship.x*TILE-camera.x,ssy=ship.y*TILE-camera.y;
  ctx.save();ctx.translate(ssx,ssy);ctx.rotate(ship.angle);
  ctx.fillStyle='#6a6a6a';ctx.beginPath();ctx.moveTo(ship.size,0);ctx.lineTo(-ship.size*.7,-ship.size*.55);ctx.lineTo(-ship.size*.4,0);ctx.lineTo(-ship.size*.7,ship.size*.55);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.moveTo(ship.size*.85,0);ctx.lineTo(ship.size*.2,-ship.size*.25);ctx.lineTo(ship.size*.2,ship.size*.25);ctx.closePath();ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ship.size*.15,0,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffaa44';ctx.beginPath();ctx.arc(ship.size*.15,0,1.8,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(shipCargo.amount>0&&shipCargo.type){
    const res=RESOURCES.find(r=>r.id===shipCargo.type);
    if(res){ctx.fillStyle=res.color;ctx.font='11px system-ui';ctx.fillText(shipCargo.amount+' '+res.name,ssx+12,ssy-8)}
  }

  // power bar
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(8,VIEW_H-70,120,28);
  ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.fillText(`⚡ +${globalPowerGen.toFixed(0)} / -${globalPowerUse.toFixed(0)}`,12,VIEW_H-52);
  ctx.fillText(`🔋 ${globalPower.toFixed(0)}/${globalPowerCap.toFixed(0)}`,12,VIEW_H-38);

  drawLiquidCounters();
  drawCoreInv();
  drawBuildMenu();
  drawBlockInfo();

  ctx.fillStyle=buildMode==='delete'?'rgba(180,30,30,.75)':'rgba(40,40,20,.6)';
  ctx.fillRect(VIEW_W/2-70,8,140,22);
  ctx.fillStyle=buildMode==='delete'?'#faa':'#fc6';ctx.font='bold 12px system-ui';ctx.textAlign='center';
  ctx.fillText(buildMode==='delete'?'РЕЖИМ: СНОС':'РЕЖИМ: СТРОЙКА',VIEW_W/2,23);
  if(ghosts.length||deleteSel.size){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(VIEW_W/2-110,34,220,18);
    ctx.fillStyle=buildMode==='delete'?'#f88':'#8f8';ctx.font='11px system-ui';
    ctx.fillText((buildMode==='delete'?'К сносу: ':'Призраков: ')+(buildMode==='delete'?deleteSel.size:ghosts.length)+' → ✓',VIEW_W/2,47);
  }
  ctx.textAlign='left';
}

function loop(t){
  const dt=Math.min(0.05,(t-lastTime)/1000);lastTime=t;
  dayNight=(dayNight+dt/120)%1; // 2 min day cycle
  updateShip(dt);
  updateBuildings(dt);
  updateItems(dt);
  draw();
  requestAnimationFrame(loop);
}

generateMap();spawnShip();requestAnimationFrame(loop);
</script>
</body>
