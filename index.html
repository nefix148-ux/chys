<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический набросок</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 10px 14px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
        }
        h1 {
            font-size: 1.05rem;
            color: #ff8c00;
            text-shadow: 0 0 12px rgba(255,140,0,0.6);
            margin-bottom: 3px;
        }
        .info {
            font-size: 0.7rem;
            color: #aaa;
            line-height: 1.3;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }
        #regen-btn, #inv-toggle {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            background: rgba(255,140,0,0.2);
            border: 1px solid #ff8c00;
            color: #ff8c00;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            pointer-events: auto;
            user-select: none;
        }
        #regen-btn { right: 16px; }
        #inv-toggle { left: 16px; }
        #regen-btn:active, #inv-toggle:active {
            background: rgba(255,140,0,0.4);
        }
        @media (max-width: 699px) {
            h1 { font-size: 0.95rem; }
            .info { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🚀 Космический набросок</h1>
        <div class="info">
            Свайп — камера · WASD — управление · Корабль летит к центру
        </div>
    </div>

    <canvas id="game"></canvas>

    <button id="inv-toggle">📦 Инвентарь</button>
    <button id="regen-btn">🔄 Новая карта</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// === РАЗМЕРЫ ===
let VIEW_W = 0, VIEW_H = 0;
function resize() {
    VIEW_W = window.innerWidth;
    VIEW_H = window.innerHeight;
    canvas.width = VIEW_W * devicePixelRatio;
    canvas.height = VIEW_H * devicePixelRatio;
    canvas.style.width = VIEW_W + 'px';
    canvas.style.height = VIEW_H + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// === НАСТРОЙКИ ===
const MAP_SIZE = 100;
const TILE = 16;

const BLOCK = { WALL: 0, DIRT: 1, FERTILE: 2, WATER: 3 };
const COLORS = {
    [BLOCK.WALL]:    '#555555',
    [BLOCK.DIRT]:    '#8B5A2B',
    [BLOCK.FERTILE]: '#5C4033',
    [BLOCK.WATER]:   '#1E90FF'
};

// Руды
const ORE = {
    NONE: 0,
    COPPER: 1,
    LEAD: 2,
    COAL: 3,
    TITANIUM: 4,
    THORIUM: 5,
    METALOM: 6
};

const ORE_COLORS = {
    [ORE.COPPER]:   '#d99d73',
    [ORE.LEAD]:     '#8c7fa9',
    [ORE.COAL]:     '#1a1a1a',
    [ORE.TITANIUM]: '#8da1b0',
    [ORE.THORIUM]:  '#f9a3c7',
    [ORE.METALOM]:  '#6e6e6e'
};

const ORE_TO_RESOURCE = {
    [ORE.COPPER]:   'copper',
    [ORE.LEAD]:     'lead',
    [ORE.COAL]:     'coal',
    [ORE.TITANIUM]: 'titanium',
    [ORE.THORIUM]:  'thorium',
    [ORE.METALOM]:  'metalom'
};

// === ИНВЕНТАРЬ ===
const RESOURCES = [
    { id: 'copper',     name: 'Медь',              color: '#d99d73', icon: 'ore' },
    { id: 'lead',       name: 'Свинец',            color: '#8c7fa9', icon: 'ore' },
    { id: 'coal',       name: 'Уголь',             color: '#272727', icon: 'ore' },
    { id: 'sand',       name: 'Песок',             color: '#f7cba0', icon: 'sand' },
    { id: 'titanium',   name: 'Титан',             color: '#8da1b0', icon: 'ore' },
    { id: 'thorium',    name: 'Торий',             color: '#f9a3c7', icon: 'ore' },
    { id: 'metalom',    name: 'Металлом',          color: '#6e6e6e', icon: 'ingot' },
    { id: 'graphite',   name: 'Графит',            color: '#b0b0b0', icon: 'ingot' },
    { id: 'metaglass',  name: 'Метастекло',        color: '#e8f4f8', icon: 'glass' },
    { id: 'silicon',    name: 'Кремний',           color: '#d4d4c8', icon: 'ingot' },
    { id: 'phase',      name: 'Фазовая ткань',     color: '#c77dff', icon: 'fabric' },
    { id: 'surge',      name: 'Кинетический сплав',color: '#f3e03b', icon: 'ingot' },
    { id: 'plastanium', name: 'Пластан',           color: '#9eff7a', icon: 'ingot' },
    { id: 'spore',      name: 'Споровый стручок',  color: '#6bcf5f', icon: 'spore' },
    { id: 'blast',      name: 'Взрывная смесь',    color: '#ff6b35', icon: 'powder' },
    { id: 'pyratite',   name: 'Пиротит',           color: '#ff3c00', icon: 'powder' }
];

const inventory = {};
RESOURCES.forEach(r => inventory[r.id] = 0);

inventory.copper = 24;
inventory.lead = 18;
inventory.coal = 45;
inventory.sand = 60;
inventory.titanium = 8;
inventory.graphite = 12;

let showInventory = true;

// === КАРТА ===
let map = [];
let oreMap = [];   // слой руд поверх террейна

function generateMap() {
    map = [];
    oreMap = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        map[y] = [];
        oreMap[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            map[y][x] = BLOCK.DIRT;
            oreMap[y][x] = ORE.NONE;
        }
    }

    // Границы
    for (let i = 0; i < MAP_SIZE; i++) {
        map[0][i] = map[MAP_SIZE-1][i] = map[i][0] = map[i][MAP_SIZE-1] = BLOCK.WALL;
    }

    // Озёра
    const lakeCount = 6 + Math.floor(Math.random() * 5);
    for (let l = 0; l < lakeCount; l++) {
        const cx = 8 + Math.floor(Math.random() * (MAP_SIZE - 16));
        const cy = 8 + Math.floor(Math.random() * (MAP_SIZE - 16));
        const radius = 4 + Math.floor(Math.random() * 9);
        for (let y = cy - radius; y <= cy + radius; y++) {
            for (let x = cx - radius; x <= cx + radius; x++) {
                if (x <= 0 || y <= 0 || x >= MAP_SIZE-1 || y >= MAP_SIZE-1) continue;
                const dist = Math.sqrt((x - cx)**2 + (y - cy)**2);
                if (dist < radius - Math.random() * 2.5) map[y][x] = BLOCK.WATER;
            }
        }
    }

    // Плодородная земля
    const fertileCount = 8 + Math.floor(Math.random() * 6);
    for (let f = 0; f < fertileCount; f++) {
        const cx = 6 + Math.floor(Math.random() * (MAP_SIZE - 12));
        const cy = 6 + Math.floor(Math.random() * (MAP_SIZE - 12));
        const radius = 5 + Math.floor(Math.random() * 10);
        for (let y = cy - radius; y <= cy + radius; y++) {
            for (let x = cx - radius; x <= cx + radius; x++) {
                if (x <= 0 || y <= 0 || x >= MAP_SIZE-1 || y >= MAP_SIZE-1) continue;
                if (map[y][x] === BLOCK.WATER) continue;
                const dist = Math.sqrt((x - cx)**2 + (y - cy)**2);
                if (dist < radius - Math.random() * 3) map[y][x] = BLOCK.FERTILE;
            }
        }
    }

    // Стены / скалы
    const wallCount = 10 + Math.floor(Math.random() * 8);
    for (let w = 0; w < wallCount; w++) {
        const cx = 5 + Math.floor(Math.random() * (MAP_SIZE - 10));
        const cy = 5 + Math.floor(Math.random() * (MAP_SIZE - 10));
        const radius = 2 + Math.floor(Math.random() * 5);
        for (let y = cy - radius; y <= cy + radius; y++) {
            for (let x = cx - radius; x <= cx + radius; x++) {
                if (x <= 0 || y <= 0 || x >= MAP_SIZE-1 || y >= MAP_SIZE-1) continue;
                const dist = Math.sqrt((x - cx)**2 + (y - cy)**2);
                if (dist < radius - Math.random() * 1.8) map[y][x] = BLOCK.WALL;
            }
        }
    }

    // Сглаживание террейна
    for (let pass = 0; pass < 3; pass++) {
        const newMap = map.map(row => row.slice());
        for (let y = 1; y < MAP_SIZE - 1; y++) {
            for (let x = 1; x < MAP_SIZE - 1; x++) {
                let waterN = 0, fertileN = 0, wallN = 0;
                for (let dy = -1; dy <= 1; dy++)
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const t = map[y+dy][x+dx];
                        if (t === BLOCK.WATER) waterN++;
                        else if (t === BLOCK.FERTILE) fertileN++;
                        else if (t === BLOCK.WALL) wallN++;
                    }
                const cur = map[y][x];
                if (cur === BLOCK.WATER && waterN < 3) newMap[y][x] = BLOCK.DIRT;
                else if (cur !== BLOCK.WATER && waterN >= 5 && Math.random() < 0.4) newMap[y][x] = BLOCK.WATER;
                else if (cur === BLOCK.WALL && wallN < 2) newMap[y][x] = BLOCK.DIRT;
                else if (cur === BLOCK.FERTILE && fertileN < 2) newMap[y][x] = BLOCK.DIRT;
            }
        }
        map = newMap;
    }

    // Границы снова стены
    for (let i = 0; i < MAP_SIZE; i++) {
        map[0][i] = map[MAP_SIZE-1][i] = map[i][0] = map[i][MAP_SIZE-1] = BLOCK.WALL;
    }

    // === ГЕНЕРАЦИЯ КЛАСТЕРОВ РУД ===
    // Руды могут появляться только на DIRT и FERTILE
    const oreTypes = [
        { type: ORE.COPPER,   count: 7,  minR: 2, maxR: 5 },
        { type: ORE.LEAD,     count: 6,  minR: 2, maxR: 5 },
        { type: ORE.COAL,     count: 8,  minR: 2, maxR: 6 },
        { type: ORE.TITANIUM, count: 4,  minR: 2, maxR: 4 },
        { type: ORE.THORIUM,  count: 3,  minR: 2, maxR: 4 },
        { type: ORE.METALOM,  count: 5,  minR: 2, maxR: 4 }
    ];

    for (const ore of oreTypes) {
        for (let c = 0; c < ore.count; c++) {
            const cx = 5 + Math.floor(Math.random() * (MAP_SIZE - 10));
            const cy = 5 + Math.floor(Math.random() * (MAP_SIZE - 10));
            const radius = ore.minR + Math.floor(Math.random() * (ore.maxR - ore.minR + 1));

            for (let y = cy - radius; y <= cy + radius; y++) {
                for (let x = cx - radius; x <= cx + radius; x++) {
                    if (x <= 0 || y <= 0 || x >= MAP_SIZE-1 || y >= MAP_SIZE-1) continue;
                    // Только на земле или плодородной
                    if (map[y][x] !== BLOCK.DIRT && map[y][x] !== BLOCK.FERTILE) continue;
                    if (oreMap[y][x] !== ORE.NONE) continue; // уже есть руда

                    const dist = Math.sqrt((x - cx)**2 + (y - cy)**2);
                    if (dist < radius - Math.random() * 1.6) {
                        oreMap[y][x] = ore.type;
                    }
                }
            }
        }
    }
}

// === КОРАБЛЬ ===
const ship = {
    x: MAP_SIZE / 2, y: MAP_SIZE / 2,
    angle: -Math.PI / 2,
    vx: 0, vy: 0,
    maxSpeed: 2.4, accel: 0.12, friction: 0.95,
    size: 13, homeForce: 0.035
};

const camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

// === ВВОД ===
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); generateMap(); spawnShip(); }
    if (e.code === 'KeyI') showInventory = !showInventory;
});
window.addEventListener('keyup', e => keys[e.code] = false);

let isDraggingCamera = false;
let lastTouchX = 0, lastTouchY = 0;

canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
        isDraggingCamera = true;
        lastTouchX = e.clientX; lastTouchY = e.clientY;
    }
});
window.addEventListener('mouseup', () => isDraggingCamera = false);
window.addEventListener('mousemove', e => {
    if (isDraggingCamera) {
        camera.targetX -= (e.clientX - lastTouchX);
        camera.targetY -= (e.clientY - lastTouchY);
        lastTouchX = e.clientX; lastTouchY = e.clientY;
    }
});

canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        isDraggingCamera = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (isDraggingCamera && e.touches.length === 1) {
        camera.targetX -= (e.touches[0].clientX - lastTouchX);
        camera.targetY -= (e.touches[0].clientY - lastTouchY);
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });

canvas.addEventListener('touchend', () => isDraggingCamera = false);
canvas.addEventListener('touchcancel', () => isDraggingCamera = false);

document.getElementById('regen-btn').addEventListener('click', () => { generateMap(); spawnShip(); });
document.getElementById('regen-btn').addEventListener('touchend', e => { e.preventDefault(); generateMap(); spawnShip(); });
document.getElementById('inv-toggle').addEventListener('click', () => showInventory = !showInventory);
document.getElementById('inv-toggle').addEventListener('touchend', e => { e.preventDefault(); showInventory = !showInventory; });

// === СПАВН ===
function spawnShip() {
    for (let i = 0; i < 300; i++) {
        const tx = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*40);
        const ty = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*40);
        if (map[ty] && (map[ty][tx] === BLOCK.DIRT || map[ty][tx] === BLOCK.FERTILE)) {
            ship.x = tx + 0.5; ship.y = ty + 0.5;
            ship.vx = 0; ship.vy = 0; ship.angle = -Math.PI/2;
            camera.x = ship.x * TILE - VIEW_W / 2;
            camera.y = ship.y * TILE - VIEW_H / 2;
            camera.targetX = camera.x; camera.targetY = camera.y;
            return;
        }
    }
    ship.x = MAP_SIZE/2; ship.y = MAP_SIZE/2;
}

// === ФИЗИКА ===
function update(dt) {
    let inputX = 0, inputY = 0;
    if (keys['KeyA'] || keys['ArrowLeft'])  inputX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    inputY -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  inputY += 1;

    const len = Math.sqrt(inputX*inputX + inputY*inputY);
    if (len > 1) { inputX /= len; inputY /= len; }
    if (len > 0.1) {
        ship.vx += inputX * ship.accel;
        ship.vy += inputY * ship.accel;
    }

    const cx = (camera.x + VIEW_W/2) / TILE;
    const cy = (camera.y + VIEW_H/2) / TILE;
    const dx = cx - ship.x, dy = cy - ship.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0.8) {
        const force = Math.min(dist * ship.homeForce, 0.12);
        ship.vx += (dx / dist) * force;
        ship.vy += (dy / dist) * force;
    }

    ship.vx *= ship.friction;
    ship.vy *= ship.friction;

    const speed = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    if (speed > ship.maxSpeed) {
        ship.vx = ship.vx / speed * ship.maxSpeed;
        ship.vy = ship.vy / speed * ship.maxSpeed;
    }

    ship.x += ship.vx * dt * 60;
    ship.y += ship.vy * dt * 60;
    ship.x = Math.max(0.5, Math.min(MAP_SIZE-0.5, ship.x));
    ship.y = Math.max(0.5, Math.min(MAP_SIZE-0.5, ship.y));

    if (speed > 0.12) {
        const target = Math.atan2(ship.vy, ship.vx);
        let diff = target - ship.angle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        ship.angle += diff * 0.2;
    }

    camera.x += (camera.targetX - camera.x) * 0.18;
    camera.y += (camera.targetY - camera.y) * 0.18;

    const maxCamX = MAP_SIZE * TILE - VIEW_W;
    const maxCamY = MAP_SIZE * TILE - VIEW_H;
    camera.x = Math.max(0, Math.min(maxCamX, camera.x));
    camera.y = Math.max(0, Math.min(maxCamY, camera.y));
    camera.targetX = Math.max(0, Math.min(maxCamX, camera.targetX));
    camera.targetY = Math.max(0, Math.min(maxCamY, camera.targetY));
}

// === ИКОНКИ ===
function drawIcon(x, y, size, type, color) {
    ctx.save();
    ctx.translate(x, y);
    if (type === 'ore') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -size*0.45);
        ctx.lineTo(size*0.4, -size*0.1);
        ctx.lineTo(size*0.25, size*0.4);
        ctx.lineTo(-size*0.25, size*0.4);
        ctx.lineTo(-size*0.4, -size*0.1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.moveTo(0, -size*0.45);
        ctx.lineTo(size*0.15, -size*0.15);
        ctx.lineTo(-size*0.05, size*0.05);
        ctx.closePath();
        ctx.fill();
    } else if (type === 'sand') {
        ctx.fillStyle = color;
        for (let i = 0; i < 5; i++) {
            const ox = Math.sin(i*2.1)*0.3 * size;
            const oy = Math.cos(i*1.7)*0.25 * size;
            ctx.beginPath(); ctx.arc(ox, oy, size*0.18, 0, Math.PI*2); ctx.fill();
        }
    } else if (type === 'ingot') {
        ctx.fillStyle = color;
        ctx.fillRect(-size*0.35, -size*0.25, size*0.7, size*0.5);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-size*0.35, -size*0.25, size*0.7, size*0.12);
    } else if (type === 'glass') {
        ctx.fillStyle = color; ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(0, -size*0.4); ctx.lineTo(size*0.35, size*0.15);
        ctx.lineTo(0, size*0.4); ctx.lineTo(-size*0.35, size*0.15);
        ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(100,180,220,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (type === 'fabric') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-size*0.4, -size*0.3);
        ctx.quadraticCurveTo(0, -size*0.5, size*0.4, -size*0.3);
        ctx.lineTo(size*0.35, size*0.35);
        ctx.quadraticCurveTo(0, size*0.2, -size*0.35, size*0.35);
        ctx.closePath(); ctx.fill();
    } else if (type === 'spore') {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.ellipse(0, 0, size*0.35, size*0.45, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(0, size*0.1, size*0.2, size*0.25, 0, 0, Math.PI*2); ctx.fill();
    } else if (type === 'powder') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-size*0.35, size*0.3); ctx.lineTo(-size*0.2, -size*0.25);
        ctx.lineTo(size*0.2, -size*0.25); ctx.lineTo(size*0.35, size*0.3);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(-size*0.15, -size*0.2, size*0.3, size*0.12);
    }
    ctx.restore();
}

function drawInventory() {
    if (!showInventory) return;
    const panelW = Math.min(210, VIEW_W * 0.42);
    const rowH = 28, padding = 10, titleH = 28;
    const panelH = titleH + RESOURCES.length * rowH + padding * 2;
    const px = 12, py = 70;

    ctx.fillStyle = 'rgba(10,10,15,0.88)';
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = 'rgba(255,140,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px, py, panelW, panelH);

    ctx.fillStyle = '#ff8c00';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText('ИНВЕНТАРЬ', px + padding, py + 20);

    ctx.font = '12px system-ui';
    RESOURCES.forEach((res, i) => {
        const ry = py + titleH + padding + i * rowH;
        const amount = inventory[res.id] || 0;
        drawIcon(px + padding + 12, ry + rowH/2 - 2, 16, res.icon, res.color);
        ctx.fillStyle = '#ddd';
        ctx.textAlign = 'left';
        ctx.fillText(res.name, px + padding + 30, ry + 17);
        ctx.fillStyle = amount > 0 ? '#ffcc66' : '#666';
        ctx.textAlign = 'right';
        ctx.fillText(String(amount), px + panelW - padding, ry + 17);
        ctx.textAlign = 'left';
    });
}

// === ОТРИСОВКА ===
function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    const startTX = Math.max(0, Math.floor(camera.x / TILE) - 1);
    const startTY = Math.max(0, Math.floor(camera.y / TILE) - 1);
    const endTX   = Math.min(MAP_SIZE, Math.ceil((camera.x + VIEW_W) / TILE) + 1);
    const endTY   = Math.min(MAP_SIZE, Math.ceil((camera.y + VIEW_H) / TILE) + 1);

    for (let y = startTY; y < endTY; y++) {
        for (let x = startTX; x < endTX; x++) {
            const type = map[y][x];
            const ore = oreMap[y][x];
            const sx = x * TILE - camera.x;
            const sy = y * TILE - camera.y;

            // Базовый террейн
            ctx.fillStyle = COLORS[type];
            ctx.fillRect(sx, sy, TILE + 0.5, TILE + 0.5);

            // Детали террейна
            if (type === BLOCK.DIRT || type === BLOCK.FERTILE) {
                ctx.fillStyle = type === BLOCK.FERTILE ? 'rgba(80,120,40,0.2)' : 'rgba(0,0,0,0.12)';
                ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            }
            if (type === BLOCK.WATER) {
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.fillRect(sx + 3, sy + 3, 4, 4);
            }
            if (type === BLOCK.WALL) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
            }

            // === РУДА поверх ===
            if (ore !== ORE.NONE) {
                const oc = ORE_COLORS[ore];
                // Основной цвет руды
                ctx.fillStyle = oc;
                ctx.globalAlpha = 0.85;
                ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
                ctx.globalAlpha = 1;

                // Блики / кристаллическая структура
                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.beginPath();
                ctx.moveTo(sx + 3, sy + 3);
                ctx.lineTo(sx + TILE - 5, sy + 4);
                ctx.lineTo(sx + 4, sy + TILE - 6);
                ctx.closePath();
                ctx.fill();

                // Тёмные края
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx + 1.5, sy + 1.5, TILE - 3, TILE - 3);
            }
        }
    }

    // Корабль
    const sx = ship.x * TILE - camera.x;
    const sy = ship.y * TILE - camera.y;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ship.angle);

    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.moveTo(ship.size, 0);
    ctx.lineTo(-ship.size*0.7, -ship.size*0.55);
    ctx.lineTo(-ship.size*0.4, 0);
    ctx.lineTo(-ship.size*0.7, ship.size*0.55);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.moveTo(ship.size*0.85, 0);
    ctx.lineTo(ship.size*0.2, -ship.size*0.25);
    ctx.lineTo(ship.size*0.2, ship.size*0.25);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(ship.size*0.15, 0, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath(); ctx.arc(ship.size*0.15, 0, 1.8, 0, Math.PI*2); ctx.fill();

    const spd = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    if (spd > 0.25) {
        ctx.fillStyle = '#ff4400';
        ctx.globalAlpha = 0.55 + Math.random()*0.4;
        ctx.beginPath();
        ctx.moveTo(-ship.size*0.55, -3.5);
        ctx.lineTo(-ship.size*0.55 - 6 - Math.random()*4, 0);
        ctx.lineTo(-ship.size*0.55, 3.5);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    ctx.restore();

    // Мини-карта
    const miniSize = Math.min(100, VIEW_W * 0.2);
    const miniScale = miniSize / MAP_SIZE;
    const mx = VIEW_W - miniSize - 10;
    const my = 60;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(mx, my, miniSize, miniSize);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(mx, my, miniSize, miniSize);

    for (let y = 0; y < MAP_SIZE; y += 2) {
        for (let x = 0; x < MAP_SIZE; x += 2) {
            let col = COLORS[map[y][x]];
            if (oreMap[y][x] !== ORE.NONE) col = ORE_COLORS[oreMap[y][x]];
            ctx.fillStyle = col;
            ctx.fillRect(mx + x*miniScale, my + y*miniScale, miniScale*2+0.5, miniScale*2+0.5);
        }
    }
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.arc(mx + ship.x*miniScale, my + ship.y*miniScale, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + (camera.x/TILE)*miniScale, my + (camera.y/TILE)*miniScale,
                   (VIEW_W/TILE)*miniScale, (VIEW_H/TILE)*miniScale);

    drawInventory();
}

// === ЦИКЛ ===
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

generateMap();
spawnShip();
requestAnimationFrame(loop);
</script>
</body>
