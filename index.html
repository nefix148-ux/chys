async function go(){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const ab=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
