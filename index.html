<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический набросок — 100x100</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #f90;
            text-shadow: 0 0 10px #f90;
        }
        .info {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 12px;
            text-align: center;
            max-width: 600px;
        }
        canvas {
            border: 2px solid #444;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.15);
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🚀 Космический набросок</h1>
    <div class="info">
        Карта 100×100 · 4 природных блока · Корабль в серо-оранжевых тонах<br>
        Камера следует за кораблём и держит его в центре экрана
    </div>
    <canvas id="game" width="800" height="600"></canvas>
    <div class="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> или стрелки — движение · 
        <kbd>Пробел</kbd> — перегенерить карту · 
        Мышью можно чуть сдвинуть камеру (зажать ЛКМ)
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// === НАСТРОЙКИ ===
const MAP_SIZE = 100;
const TILE = 16;               // размер тайла в пикселях
const VIEW_W = canvas.width;
const VIEW_H = canvas.height;

// Типы блоков
const BLOCK = {
    WALL: 0,
    DIRT: 1,
    FERTILE: 2,
    WATER: 3
};

const COLORS = {
    [BLOCK.WALL]:    '#555555',
    [BLOCK.DIRT]:    '#8B5A2B',
    [BLOCK.FERTILE]: '#5C4033',
    [BLOCK.WATER]:   '#1E90FF'
};

// === КАРТА ===
let map = [];

function generateMap() {
    map = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        map[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            // Границы — стены
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) {
                map[y][x] = BLOCK.WALL;
                continue;
            }
            // Случайный рельеф
            const r = Math.random();
            if (r < 0.08) map[y][x] = BLOCK.WALL;
            else if (r < 0.25) map[y][x] = BLOCK.WATER;
            else if (r < 0.55) map[y][x] = BLOCK.FERTILE;
            else map[y][x] = BLOCK.DIRT;
        }
    }

    // Немного сгладим воду (чтобы были озёра)
    for (let y = 1; y < MAP_SIZE-1; y++) {
        for (let x = 1; x < MAP_SIZE-1; x++) {
            if (map[y][x] === BLOCK.WATER) {
                let neighbors = 0;
                for (let dy = -1; dy <= 1; dy++)
                    for (let dx = -1; dx <= 1; dx++)
                        if (map[y+dy][x+dx] === BLOCK.WATER) neighbors++;
                if (neighbors < 3 && Math.random() < 0.6) map[y][x] = BLOCK.DIRT;
            }
        }
    }
}

// === КОРАБЛЬ ===
const ship = {
    x: MAP_SIZE / 2,
    y: MAP_SIZE / 2,
    angle: 0,          // радианы
    speed: 0,
    maxSpeed: 4.5,
    accel: 0.18,
    friction: 0.92,
    turnSpeed: 0.08,
    size: 14
};

// === КАМЕРА ===
// Камера хранит смещение в мировых координатах (в пикселях)
// Корабль всегда стремится к центру экрана
let camera = {
    x: 0,
    y: 0,
    // Лёгкий лаг для "отдельного" движения
    lag: 0.12,
    // Можно сдвигать мышью
    offsetX: 0,
    offsetY: 0,
    dragging: false,
    lastMouseX: 0,
    lastMouseY: 0
};

// === ВВОД ===
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        generateMap();
        // Спавним корабль в безопасном месте
        spawnShip();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Мышь для сдвига камеры
canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
        camera.dragging = true;
        camera.lastMouseX = e.clientX;
        camera.lastMouseY = e.clientY;
    }
});
window.addEventListener('mouseup', () => camera.dragging = false);
window.addEventListener('mousemove', e => {
    if (camera.dragging) {
        const dx = e.clientX - camera.lastMouseX;
        const dy = e.clientY - camera.lastMouseY;
        camera.offsetX -= dx;
        camera.offsetY -= dy;
        camera.lastMouseX = e.clientX;
        camera.lastMouseY = e.clientY;
    }
});

// === СПАВН ===
function spawnShip() {
    // Ищем землю недалеко от центра
    for (let attempt = 0; attempt < 200; attempt++) {
        const tx = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*30);
        const ty = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*30);
        if (map[ty] && map[ty][tx] !== BLOCK.WALL && map[ty][tx] !== BLOCK.WATER) {
            ship.x = tx + 0.5;
            ship.y = ty + 0.5;
            ship.speed = 0;
            ship.angle = -Math.PI/2;
            return;
        }
    }
    ship.x = MAP_SIZE/2;
    ship.y = MAP_SIZE/2;
}

// === ФИЗИКА ===
function update(dt) {
    // Поворот
    if (keys['KeyA'] || keys['ArrowLeft'])  ship.angle -= ship.turnSpeed;
    if (keys['KeyD'] || keys['ArrowRight']) ship.angle += ship.turnSpeed;

    // Ускорение
    if (keys['KeyW'] || keys['ArrowUp']) {
        ship.speed += ship.accel;
    } else if (keys['KeyS'] || keys['ArrowDown']) {
        ship.speed -= ship.accel * 0.6;
    } else {
        ship.speed *= ship.friction;
    }

    ship.speed = Math.max(-ship.maxSpeed*0.4, Math.min(ship.maxSpeed, ship.speed));

    // Движение
    const nextX = ship.x + Math.cos(ship.angle) * ship.speed * dt * 60;
    const nextY = ship.y + Math.sin(ship.angle) * ship.speed * dt * 60;

    // Коллизии (простая проверка тайла)
    const checkTile = (px, py) => {
        const tx = Math.floor(px);
        const ty = Math.floor(py);
        if (tx < 0 || ty < 0 || tx >= MAP_SIZE || ty >= MAP_SIZE) return false;
        const t = map[ty][tx];
        return t !== BLOCK.WALL && t !== BLOCK.WATER;
    };

    if (checkTile(nextX, ship.y)) ship.x = nextX;
    else ship.speed *= 0.3;

    if (checkTile(ship.x, nextY)) ship.y = nextY;
    else ship.speed *= 0.3;

    // Камера стремится держать корабль в центре + ручной оффсет
    const targetCamX = ship.x * TILE - VIEW_W / 2;
    const targetCamY = ship.y * TILE - VIEW_H / 2;

    camera.x += (targetCamX - camera.x) * camera.lag;
    camera.y += (targetCamY - camera.y) * camera.lag;

    // Ограничиваем камеру границами карты
    camera.x = Math.max(0, Math.min(MAP_SIZE * TILE - VIEW_W, camera.x + camera.offsetX));
    camera.y = Math.max(0, Math.min(MAP_SIZE * TILE - VIEW_H, camera.y + camera.offsetY));
    
    // Плавно возвращаем оффсет к нулю (корабль "стремится" в центр)
    camera.offsetX *= 0.96;
    camera.offsetY *= 0.96;
}

// === ОТРИСОВКА ===
function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    // Видимая область тайлов
    const startTX = Math.max(0, Math.floor(camera.x / TILE) - 1);
    const startTY = Math.max(0, Math.floor(camera.y / TILE) - 1);
    const endTX   = Math.min(MAP_SIZE, Math.ceil((camera.x + VIEW_W) / TILE) + 1);
    const endTY   = Math.min(MAP_SIZE, Math.ceil((camera.y + VIEW_H) / TILE) + 1);

    // Рисуем тайлы
    for (let y = startTY; y < endTY; y++) {
        for (let x = startTX; x < endTX; x++) {
            const type = map[y][x];
            const sx = x * TILE - camera.x;
            const sy = y * TILE - camera.y;

            ctx.fillStyle = COLORS[type];
            ctx.fillRect(sx, sy, TILE, TILE);

            // Лёгкая детализация
            if (type === BLOCK.DIRT || type === BLOCK.FERTILE) {
                ctx.fillStyle = type === BLOCK.FERTILE ? 'rgba(80,120,40,0.25)' : 'rgba(0,0,0,0.12)';
                ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            }
            if (type === BLOCK.WATER) {
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fillRect(sx + 3, sy + 3, 4, 4);
            }
            if (type === BLOCK.WALL) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
            }
        }
    }

    // === КОРАБЛЬ ===
    const sx = ship.x * TILE - camera.x;
    const sy = ship.y * TILE - camera.y;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ship.angle);

    // Корпус (серо-оранжевый)
    // Основной корпус
    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.moveTo(ship.size, 0);
    ctx.lineTo(-ship.size * 0.7, -ship.size * 0.55);
    ctx.lineTo(-ship.size * 0.4, 0);
    ctx.lineTo(-ship.size * 0.7, ship.size * 0.55);
    ctx.closePath();
    ctx.fill();

    // Оранжевые акценты
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.moveTo(ship.size * 0.85, 0);
    ctx.lineTo(ship.size * 0.2, -ship.size * 0.25);
    ctx.lineTo(ship.size * 0.2, ship.size * 0.25);
    ctx.closePath();
    ctx.fill();

    // Кабина
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(ship.size * 0.15, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.arc(ship.size * 0.15, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    // Двигатели (когда летим)
    if (Math.abs(ship.speed) > 0.3) {
        ctx.fillStyle = ship.speed > 0 ? '#ff4400' : '#4488ff';
        ctx.globalAlpha = 0.7 + Math.random() * 0.3;
        ctx.beginPath();
        ctx.moveTo(-ship.size * 0.55, -4);
        ctx.lineTo(-ship.size * 0.55 - 8 - Math.random()*6, 0);
        ctx.lineTo(-ship.size * 0.55, 4);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Мини-карта (правый верхний угол)
    const miniSize = 120;
    const miniScale = miniSize / MAP_SIZE;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(VIEW_W - miniSize - 12, 12, miniSize, miniSize);
    ctx.strokeStyle = '#666';
    ctx.strokeRect(VIEW_W - miniSize - 12, 12, miniSize, miniSize);

    for (let y = 0; y < MAP_SIZE; y += 2) {
        for (let x = 0; x < MAP_SIZE; x += 2) {
            ctx.fillStyle = COLORS[map[y][x]];
            ctx.fillRect(
                VIEW_W - miniSize - 12 + x * miniScale,
                12 + y * miniScale,
                miniScale * 2,
                miniScale * 2
            );
        }
    }
    // Корабль на мини-карте
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.arc(
        VIEW_W - miniSize - 12 + ship.x * miniScale,
        12 + ship.y * miniScale,
        3, 0, Math.PI*2
    );
    ctx.fill();

    // Инфо
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(8, 8, 180, 50);
    ctx.fillStyle = '#ff8c00';
    ctx.font = '12px monospace';
    ctx.fillText(`Позиция: ${ship.x.toFixed(1)}, ${ship.y.toFixed(1)}`, 16, 26);
    ctx.fillText(`Скорость: ${ship.speed.toFixed(2)}`, 16, 42);
}

// === ЦИКЛ ===
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// Старт
generateMap();
spawnShip();
requestAnimationFrame(loop);
</script>
</body>
</html>
