<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический набросок</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            pointer-events: none;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        h1 {
            font-size: 1.1rem;
            color: #ff8c00;
            text-shadow: 0 0 12px rgba(255,140,0,0.6);
            margin-bottom: 4px;
        }
        .info {
            font-size: 0.75rem;
            color: #aaa;
            line-height: 1.3;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }
        #controls-hint {
            position: absolute;
            bottom: 16px;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            pointer-events: none;
            z-index: 10;
        }
        #regen-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 20;
            background: rgba(255,140,0,0.2);
            border: 1px solid #ff8c00;
            color: #ff8c00;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            pointer-events: auto;
            user-select: none;
        }
        #regen-btn:active {
            background: rgba(255,140,0,0.4);
        }
        @media (max-width: 699px) {
            h1 { font-size: 1rem; }
            .info { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🚀 Космический набросок</h1>
        <div class="info">
            Свайп — двигай камеру · Корабль сам летит к центру<br>
            WASD / стрелки — ручное управление · Корабль летает над всем
        </div>
    </div>

    <canvas id="game"></canvas>

    <button id="regen-btn">🔄 Новая карта</button>

    <div id="controls-hint">
        WASD / стрелки — летать · Пробел — новая карта · ЛКМ + drag / свайп — камера
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// === РАЗМЕРЫ ===
let VIEW_W = 0, VIEW_H = 0;
function resize() {
    VIEW_W = window.innerWidth;
    VIEW_H = window.innerHeight;
    canvas.width = VIEW_W * devicePixelRatio;
    canvas.height = VIEW_H * devicePixelRatio;
    canvas.style.width = VIEW_W + 'px';
    canvas.style.height = VIEW_H + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// === НАСТРОЙКИ ===
const MAP_SIZE = 100;
const TILE = 16;

const BLOCK = { WALL: 0, DIRT: 1, FERTILE: 2, WATER: 3 };
const COLORS = {
    [BLOCK.WALL]:    '#555555',
    [BLOCK.DIRT]:    '#8B5A2B',
    [BLOCK.FERTILE]: '#5C4033',
    [BLOCK.WATER]:   '#1E90FF'
};

// === КАРТА ===
let map = [];
function generateMap() {
    map = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        map[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) {
                map[y][x] = BLOCK.WALL;
                continue;
            }
            const r = Math.random();
            if (r < 0.08) map[y][x] = BLOCK.WALL;
            else if (r < 0.25) map[y][x] = BLOCK.WATER;
            else if (r < 0.55) map[y][x] = BLOCK.FERTILE;
            else map[y][x] = BLOCK.DIRT;
        }
    }
    // Сглаживание воды
    for (let y = 1; y < MAP_SIZE-1; y++) {
        for (let x = 1; x < MAP_SIZE-1; x++) {
            if (map[y][x] === BLOCK.WATER) {
                let n = 0;
                for (let dy = -1; dy <= 1; dy++)
                    for (let dx = -1; dx <= 1; dx++)
                        if (map[y+dy][x+dx] === BLOCK.WATER) n++;
                if (n < 3 && Math.random() < 0.6) map[y][x] = BLOCK.DIRT;
            }
        }
    }
}

// === КОРАБЛЬ ===
const ship = {
    x: MAP_SIZE / 2,
    y: MAP_SIZE / 2,
    angle: -Math.PI / 2,
    vx: 0,
    vy: 0,
    maxSpeed: 2.4,
    accel: 0.12,
    friction: 0.95,
    size: 13,
    // Сила притяжения к центру экрана
    homeForce: 0.035
};

// === КАМЕРА (свободная) ===
const camera = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0
};

// === ВВОД ===
const keys = {};

// Клавиатура
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        generateMap();
        spawnShip();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Мышь / тач для камеры (свайп)
let isDraggingCamera = false;
let lastTouchX = 0, lastTouchY = 0;

canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
        isDraggingCamera = true;
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
    }
});
window.addEventListener('mouseup', () => isDraggingCamera = false);
window.addEventListener('mousemove', e => {
    if (isDraggingCamera) {
        const dx = e.clientX - lastTouchX;
        const dy = e.clientY - lastTouchY;
        camera.targetX -= dx;
        camera.targetY -= dy;
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
    }
});

// Touch для камеры
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        isDraggingCamera = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (isDraggingCamera && e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        camera.targetX -= dx;
        camera.targetY -= dy;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });

canvas.addEventListener('touchend', () => isDraggingCamera = false);
canvas.addEventListener('touchcancel', () => isDraggingCamera = false);

// Кнопка регена
document.getElementById('regen-btn').addEventListener('click', () => {
    generateMap();
    spawnShip();
});
document.getElementById('regen-btn').addEventListener('touchend', e => {
    e.preventDefault();
    generateMap();
    spawnShip();
});

// === СПАВН ===
function spawnShip() {
    for (let i = 0; i < 200; i++) {
        const tx = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*28);
        const ty = Math.floor(MAP_SIZE/2 + (Math.random()-0.5)*28);
        if (map[ty] && map[ty][tx] !== undefined) {
            ship.x = tx + 0.5;
            ship.y = ty + 0.5;
            ship.vx = 0;
            ship.vy = 0;
            ship.angle = -Math.PI/2;
            camera.x = ship.x * TILE - VIEW_W / 2;
            camera.y = ship.y * TILE - VIEW_H / 2;
            camera.targetX = camera.x;
            camera.targetY = camera.y;
            return;
        }
    }
    ship.x = MAP_SIZE/2;
    ship.y = MAP_SIZE/2;
}

// === ФИЗИКА ===
function update(dt) {
    // === Ручное управление (WASD) ===
    let inputX = 0, inputY = 0;

    if (keys['KeyA'] || keys['ArrowLeft'])  inputX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;
    if (keys['KeyW'] || keys['ArrowUp'])    inputY -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  inputY += 1;

    const len = Math.sqrt(inputX*inputX + inputY*inputY);
    if (len > 1) {
        inputX /= len;
        inputY /= len;
    }

    if (len > 0.1) {
        // Ускоряем в направлении ввода
        ship.vx += inputX * ship.accel;
        ship.vy += inputY * ship.accel;
    }

    // === ПРИТЯЖЕНИЕ К ЦЕНТРУ ЭКРАНА ===
    const centerWorldX = (camera.x + VIEW_W / 2) / TILE;
    const centerWorldY = (camera.y + VIEW_H / 2) / TILE;

    const toCenterX = centerWorldX - ship.x;
    const toCenterY = centerWorldY - ship.y;
    const distToCenter = Math.sqrt(toCenterX*toCenterX + toCenterY*toCenterY);

    if (distToCenter > 0.8) {
        const force = Math.min(distToCenter * ship.homeForce, 0.12);
        ship.vx += (toCenterX / distToCenter) * force;
        ship.vy += (toCenterY / distToCenter) * force;
    }

    // Трение
    ship.vx *= ship.friction;
    ship.vy *= ship.friction;

    // Ограничение скорости
    const speed = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    if (speed > ship.maxSpeed) {
        ship.vx = ship.vx / speed * ship.maxSpeed;
        ship.vy = ship.vy / speed * ship.maxSpeed;
    }

    // Движение — БЕЗ коллизий, летает над всем
    ship.x += ship.vx * dt * 60;
    ship.y += ship.vy * dt * 60;

    // Не даём улететь за границы карты
    ship.x = Math.max(0.5, Math.min(MAP_SIZE - 0.5, ship.x));
    ship.y = Math.max(0.5, Math.min(MAP_SIZE - 0.5, ship.y));

    // === КОРАБЛЬ ВСЕГДА СМОТРИТ В СТОРОНУ ДВИЖЕНИЯ ===
    if (speed > 0.12) {
        const targetAngle = Math.atan2(ship.vy, ship.vx);
        let diff = targetAngle - ship.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        // Плавный, но быстрый поворот в сторону скорости
        ship.angle += diff * 0.2;
    }

    // Камера плавно следует за target
    camera.x += (camera.targetX - camera.x) * 0.18;
    camera.y += (camera.targetY - camera.y) * 0.18;

    // Ограничение камеры
    const maxCamX = MAP_SIZE * TILE - VIEW_W;
    const maxCamY = MAP_SIZE * TILE - VIEW_H;
    camera.x = Math.max(0, Math.min(maxCamX, camera.x));
    camera.y = Math.max(0, Math.min(maxCamY, camera.y));
    camera.targetX = Math.max(0, Math.min(maxCamX, camera.targetX));
    camera.targetY = Math.max(0, Math.min(maxCamY, camera.targetY));
}

// === ОТРИСОВКА ===
function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    const startTX = Math.max(0, Math.floor(camera.x / TILE) - 1);
    const startTY = Math.max(0, Math.floor(camera.y / TILE) - 1);
    const endTX   = Math.min(MAP_SIZE, Math.ceil((camera.x + VIEW_W) / TILE) + 1);
    const endTY   = Math.min(MAP_SIZE, Math.ceil((camera.y + VIEW_H) / TILE) + 1);

    for (let y = startTY; y < endTY; y++) {
        for (let x = startTX; x < endTX; x++) {
            const type = map[y][x];
            const sx = x * TILE - camera.x;
            const sy = y * TILE - camera.y;

            ctx.fillStyle = COLORS[type];
            ctx.fillRect(sx, sy, TILE + 0.5, TILE + 0.5);

            if (type === BLOCK.DIRT || type === BLOCK.FERTILE) {
                ctx.fillStyle = type === BLOCK.FERTILE ? 'rgba(80,120,40,0.25)' : 'rgba(0,0,0,0.12)';
                ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            }
            if (type === BLOCK.WATER) {
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.fillRect(sx + 3, sy + 3, 4, 4);
            }
            if (type === BLOCK.WALL) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
            }
        }
    }

    // Корабль
    const sx = ship.x * TILE - camera.x;
    const sy = ship.y * TILE - camera.y;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ship.angle);

    // Корпус
    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.moveTo(ship.size, 0);
    ctx.lineTo(-ship.size * 0.7, -ship.size * 0.55);
    ctx.lineTo(-ship.size * 0.4, 0);
    ctx.lineTo(-ship.size * 0.7, ship.size * 0.55);
    ctx.closePath();
    ctx.fill();

    // Оранжевые акценты
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.moveTo(ship.size * 0.85, 0);
    ctx.lineTo(ship.size * 0.2, -ship.size * 0.25);
    ctx.lineTo(ship.size * 0.2, ship.size * 0.25);
    ctx.closePath();
    ctx.fill();

    // Кабина
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(ship.size * 0.15, 0, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.arc(ship.size * 0.15, 0, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Двигатель (когда летит)
    const spd = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    if (spd > 0.25) {
        ctx.fillStyle = '#ff4400';
        ctx.globalAlpha = 0.55 + Math.random() * 0.4;
        ctx.beginPath();
        ctx.moveTo(-ship.size * 0.55, -3.5);
        ctx.lineTo(-ship.size * 0.55 - 6 - Math.random()*4, 0);
        ctx.lineTo(-ship.size * 0.55, 3.5);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Мини-карта
    const miniSize = Math.min(110, VIEW_W * 0.22);
    const miniScale = miniSize / MAP_SIZE;
    const mx = VIEW_W - miniSize - 12;
    const my = 70;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(mx, my, miniSize, miniSize);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(mx, my, miniSize, miniSize);

    for (let y = 0; y < MAP_SIZE; y += 2) {
        for (let x = 0; x < MAP_SIZE; x += 2) {
            ctx.fillStyle = COLORS[map[y][x]];
            ctx.fillRect(mx + x * miniScale, my + y * miniScale, miniScale * 2 + 0.5, miniScale * 2 + 0.5);
        }
    }
    // Корабль
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.arc(mx + ship.x * miniScale, my + ship.y * miniScale, 3, 0, Math.PI*2);
    ctx.fill();

    // Рамка видимой области
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(
        mx + (camera.x / TILE) * miniScale,
        my + (camera.y / TILE) * miniScale,
        (VIEW_W / TILE) * miniScale,
        (VIEW_H / TILE) * miniScale
    );
}

// === ЦИКЛ ===
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

generateMap();
spawnShip();
requestAnimationFrame(loop);
</script>
</body>
</html>
