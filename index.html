let core={x:0,y:0},coreInventory={};
let ship={x:0,y:0,vx:0,vy:0,angle:0,size:10};
const shipCargo={type:null,amount:0};
let camera={x:0,y:0,targetX:0,targetY:0};
let selectedBlock=null,selectedDir=DIR.RIGHT,buildMode='place';
let ghosts=[],deleteSel=new Set(),showCoreInv=false,showBlockInfo=false,infoBlock=null;
let globalPower=0,globalPowerGen=0,globalPowerUse=0,globalPowerCap=0;
let dayNight=0.5; // 0 night .. 1 day

// === MAP GENERATION ===
function generateMap(){
  map=[];oreMap=[];buildMap=[];items=[];liquidItems=[];showCoreInv=false;ghosts=[];deleteSel.clear();
  for(let y=0;y<MAP_SIZE;y++){map[y]=[];oreMap[y]=[];buildMap[y]=[];for(let x=0;x<MAP_SIZE;x++){map[y][x]=BLOCK.DIRT;oreMap[y][x]=ORE.NONE;buildMap[y][x]=null}}
  // borders
  for(let i=0;i<MAP_SIZE;i++){map[0][i]=map[MAP_SIZE-1][i]=map[i][0]=map[i][MAP_SIZE-1]=BLOCK.WALL}
  // water lakes
  for(let w=0;w<12+Math.random()*8;w++){const cx=8+Math.floor(Math.random()*(MAP_SIZE-16)),cy=8+Math.floor(Math.random()*(MAP_SIZE-16)),r=3+Math.floor(Math.random()*7);for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random()*1.5)map[y][x]=BLOCK.WATER}}
  // fertile
  for(let f=0;f<16+Math.random()*10;f++){const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),r=6+Math.floor(Math.random()*12);for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1||map[y][x]===BLOCK.WATER)continue;if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random()*3.5)map[y][x]=BLOCK.FERTILE}}
  // hot tiles
  for(let h=0;h<8+Math.random()*6;h++){const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),r=2+Math.floor(Math.random()*4);for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;if(map[y][x]===BLOCK.WATER||map[y][x]===BLOCK.WALL)continue;if(Math.sqrt((x-cx)**2+(y-cy)**2)<r-Math.random()*1.5)map[y][x]=BLOCK.HOT}}
  // core
  core.x=Math.floor(MAP_SIZE/2);core.y=Math.floor(MAP_SIZE/2);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=core.x+dx,y=core.y+dy;if(x>0&&y>0&&x<MAP_SIZE-1&&y<MAP_SIZE-1)map[y][x]=BLOCK.CORE}
  // ores clusters
  const oreTypes=[{type:ORE.COPPER,count:14,minR:3,maxR:7},{type:ORE.LEAD,count:12,minR:3,maxR:6},{type:ORE.COAL,count:10,minR:2,maxR:5},{type:ORE.TITANIUM,count:7,minR:2,maxR:4},{type:ORE.THORIUM,count:4,minR:2,maxR:3},{type:ORE.METALOM,count:5,minR:2,maxR:4}];
  const centers=[];for(const ore of oreTypes){let pl=0,att=0;while(pl<ore.count&&att<ore.count*30){att++;const cx=10+Math.floor(Math.random()*(MAP_SIZE-20)),cy=10+Math.floor(Math.random()*(MAP_SIZE-20)),radius=ore.minR+Math.floor(Math.random()*(ore.maxR-ore.minR+1));if(centers.some(p=>Math.sqrt((cx-p.x)**2+(cy-p.y)**2)<radius+p.r+3))continue;if(Math.abs(cx-core.x)<radius+3&&Math.abs(cy-core.y)<radius+3)continue;let free=0,tot=0;for(let y=cy-radius;y<=cy+radius;y++)for(let x=cx-radius;x<=cx+radius;x++){if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;if(Math.sqrt((x-cx)**2+(y-cy)**2)>radius)continue;tot++;if(oreMap[y][x]===ORE.NONE&&(map[y][x]===BLOCK.DIRT||map[y][x]===BLOCK.FERTILE||map[y][x]===BLOCK.HOT))free++}if(tot===0||free/tot<.5)continue;for(let y=cy-radius;y<=cy+radius;y++)for(let x=cx-radius;x<=cx+radius;x++){if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)continue;if(map[y][x]===BLOCK.WATER||map[y][x]===BLOCK.WALL||map[y][x]===BLOCK.CORE)continue;if(oreMap[y][x]!==ORE.NONE)continue;if(Math.sqrt((x-cx)**2+(y-cy)**2)<radius-Math.random()*1.8)oreMap[y][x]=ore.type}centers.push({x:cx,y:cy,r:radius});pl++}}
  RESOURCES.forEach(r=>coreInventory[r.id]=0);shipCargo.type=null;shipCargo.amount=0;
}

function spawnShip(){ship.x=core.x+.5;ship.y=core.y-2.5;ship.vx=0;ship.vy=0;ship.angle=-Math.PI/2;camera.x=ship.x*TILE-VIEW_W/2;camera.y=ship.y*TILE-VIEW_H/2;camera.targetX=camera.x;camera.targetY=camera.y}

// === INPUT ===
let pointers={},lastTap=0,menuDown=false;
function handlePointerDown(sx,sy,type){
  const now=performance.now();
  if(now-lastTap<280){// double
    const tile=getTileFromScreen(sx,sy);
    tryMine(tile.x,tile.y);
    lastTap=0;return;
  }
  lastTap=now;
  // UI hit tests first
  if(hitUI(sx,sy))return;
  if(buildMode==='place'&&selectedBlock){
    const tile=getTileFromScreen(sx,sy);
    if(canPlace(tile.x,tile.y,selectedBlock)){
      ghosts.push({x:tile.x,y:tile.y,type:selectedBlock,dir:selectedDir});
    }
  }else if(buildMode==='delete'){
    const tile=getTileFromScreen(sx,sy);
    toggleDeleteSel(tile.x,tile.y);
  }else{
    // try remove ghost
    if(removeGhostAt(sx,sy))return;
  }
  pointers[type]={x:sx,y:sy,ox:sx,oy:sy,moved:false};
}
function handlePointerMove(sx,sy){
  for(const k in pointers){
    const p=pointers[k];
    if(!p)continue;
    const dx=sx-p.x,dy=sy-p.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4)p.moved=true;
    if(p.moved){
      camera.targetX-=dx;camera.targetY-=dy;
      p.x=sx;p.y=sy;
    }
  }
}
function handlePointerUp(sx,sy,type){
  const p=pointers[type];delete pointers[type];
  if(!p||p.moved)return;
  // single click actions already handled on down for place/delete
}
function getTileFromScreen(sx,sy){return{x:Math.floor((sx+camera.x)/TILE),y:Math.floor((sy+camera.y)/TILE)}}
function removeGhostAt(sx,sy){
  const tile=getTileFromScreen(sx,sy);
  for(let i=ghosts.length-1;i>=0;i--){
    const g=ghosts[i];const s=BUILDING_DEFS[g.type]?.size||1;
    if(tile.x>=g.x&&tile.x<g.x+s&&tile.y>=g.y&&tile.y<g.y+s){ghosts.splice(i,1);return true}
  }
  return false;
}
function canPlace(tx,ty,type){
  const def=BUILDING_DEFS[type];if(!def)return false;
  const s=def.size;
  for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++){
    const x=tx+dx,y=ty+dy;
    if(x<=0||y<=0||x>=MAP_SIZE-1||y>=MAP_SIZE-1)return false;
    if(map[y][x]===BLOCK.WALL||map[y][x]===BLOCK.CORE)return false;
    if(buildMap[y][x])return false;
  }
  return true;
}
function placeBuilding(tx,ty,type,dir){
  if(!canPlace(tx,ty,type))return false;
  const def=BUILDING_DEFS[type];
  const b={type,x:tx,y:ty,dir:dir??0,items:{},liquids:{},progress:0,power:0,timer:0};
  for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++){
    if(dx===0&&dy===0)buildMap[ty][tx]=b;
    else buildMap[ty+dy][tx+dx]={type:'part',parentX:tx,parentY:ty};
  }
  return true;
}
function getMainBuildingKey(tx,ty){
  const b=buildMap[ty]?.[tx];if(!b)return null;
  if(b.type==='part')return b.parentX+','+b.parentY;
  return tx+','+ty;
}
function toggleDeleteSel(tx,ty){
  const key=getMainBuildingKey(tx,ty);if(!key)return;
  if(deleteSel.has(key))deleteSel.delete(key);else deleteSel.add(key);
}
function hasPending(){return ghosts.length>0||deleteSel.size>0}

// UI layout constants
const BTN_W=52,BTN_H=44,GAP=6;
function hitUI(sx,sy){
  const menuBottom=VIEW_H-10,modeY=menuBottom-BTN_H,modeX=VIEW_W-14-BTN_W;
  // mode toggle
  if(sx>=modeX&&sx<=modeX+BTN_W&&sy>=modeY&&sy<=modeY+BTN_H){
    if(buildMode==='place'){buildMode='delete';/* ghosts stay */}
    else{buildMode='place';deleteSel.clear()}
    return true;
  }
  // confirm button
  const leftX=modeX-BTN_W-GAP;
  if(hasPending()&&sx>=leftX&&sx<=leftX+BTN_W&&sy>=modeY&&sy<=modeY+BTN_H){
    if(buildMode==='place'&&ghosts.length){
      for(const g of ghosts)placeBuilding(g.x,g.y,g.type,g.dir);
      ghosts=[];
    }else if(buildMode==='delete'&&deleteSel.size){
      for(const key of deleteSel){
        const [px,py]=key.split(',').map(Number);
        const b=buildMap[py]?.[px];if(!b||b.type==='part')continue;
        const def=BUILDING_DEFS[b.type];if(!def)continue;
        for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++)buildMap[py+dy][px+dx]=null;
      }
      deleteSel.clear();
    }
    return true;
  }
  // rotate
  if(buildMode==='place'&&selectedBlock&&BUILDING_DEFS[selectedBlock]?.directional){
    if(sx>=leftX&&sx<=leftX+BTN_W&&sy>=modeY-BTN_H-GAP&&sy<=modeY-GAP){
      selectedDir=(selectedDir+1)%4;
      if(ghosts.length)ghosts[ghosts.length-1].dir=selectedDir;
      return true;
    }
  }
  // categories
  for(let i=0;i<CATEGORIES.length;i++){
    const col=i%3,row=Math.floor(i/3);
    const bx=VIEW_W-14-(2-col)*(BTN_W+GAP);
    const by=menuBottom-BTN_H*2-GAP*2-(1-row)*(BTN_H+GAP);
    if(sx>=bx&&sx<=bx+BTN_W&&sy>=by&&sy<=by+BTN_H){
      // select first of category or keep
      const cat=CATEGORIES[i];
      if(cat.blocks.length){selectedBlock=cat.blocks[0];buildMode='place';deleteSel.clear()}
      return true;
    }
  }
  // block list (left of categories)
  const listW=BTN_W*3+GAP*2;
  const listX=VIEW_W-14-2*(BTN_W+GAP)-10-listW;
  // simplified: click in list area selects
  return false;
}

// mining
function tryMine(tx,ty){
  if(tx<=0||ty<=0||tx>=MAP_SIZE-1||ty>=MAP_SIZE-1)return;
  const ore=oreMap[ty][tx];
  if(ore===ORE.NONE&&map[ty][tx]===BLOCK.FERTILE){
    // sand from fertile
    if(distToCore(tx,ty)<=CORE_RANGE){coreInventory.sand=(coreInventory.sand||0)+1;showCoreInv=true}
    else if((shipCargo.type===null||shipCargo.type==='sand')&&shipCargo.amount<PLAYER_MAX){shipCargo.type='sand';shipCargo.amount++}
    return;
  }
  if(ore===ORE.NONE||ore===ORE.TITANIUM||ore===ORE.THORIUM)return; // player cannot mine Ti/Th
  const resId=ORE_TO_ID[ore];
  if(distToCore(tx,ty)<=CORE_RANGE){coreInventory[resId]=(coreInventory[resId]||0)+1;showCoreInv=true}
  else if((shipCargo.type===null||shipCargo.type===resId)&&shipCargo.amount<PLAYER_MAX){shipCargo.type=resId;shipCargo.amount++}
}
function distToCore(tx,ty){return Math.max(Math.abs(tx-core.x),Math.abs(ty-core.y))}

// drop cargo
function tryDropCargo(){
  if(shipCargo.amount<=0)return;
  const tile=getTileFromScreen(VIEW_W/2,VIEW_H/2); // near ship roughly
  // simplified: drop near ship position
  const sx=Math.floor(ship.x),sy=Math.floor(ship.y);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const b=buildMap[sy+dy]?.[sx+dx];
    if(b&&b.type!=='part'&&BUILDING_DEFS[b.type]){
      // try put on conveyor or into core range
      if(distToCore(sx+dx,sy+dy)<=CORE_RANGE){
        coreInventory[shipCargo.type]=(coreInventory[shipCargo.type]||0)+shipCargo.amount;
        shipCargo.type=null;shipCargo.amount=0;showCoreInv=true;return;
      }
    }
  }
}

// === SIMULATION helpers ===
function countCoverage(x,y,size,pred){
  let n=0,tot=size*size;
  for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++)if(pred(x+dx,y+dy))n++;
  return {n,ratio:n/tot,tot};
}
function addItem(b,id,amt){
  if(!b.items)b.items={};
  const def=BUILDING_DEFS[b.type];const cap=def?.itemCap||10;
  const cur=Object.values(b.items).reduce((a,v)=>a+v,0);
  const add=Math.min(amt,cap-cur);
  if(add>0)b.items[id]=(b.items[id]||0)+add;
  return add;
}
function takeItem(b,id,amt){
  if(!b.items)return 0;
  const have=b.items[id]||0;
  const t=Math.min(have,amt);
  if(t>0){b.items[id]-=t;if(b.items[id]<=0)delete b.items[id]}
  return t;
}
function addLiquid(b,id,amt){
  if(!b.liquids)b.liquids={};
  const def=BUILDING_DEFS[b.type];const cap=def?.liqCap||60;
  const cur=Object.values(b.liquids).reduce((a,v)=>a+v,0);
  const add=Math.min(amt,cap-cur);
  if(add>0)b.liquids[id]=(b.liquids[id]||0)+add;
  return add;
}
function takeLiquid(b,id,amt){
  if(!b.liquids)return 0;
  const have=b.liquids[id]||0;
  const t=Math.min(have,amt);
  if(t>0){b.liquids[id]-=t;if(b.liquids[id]<=0)delete b.liquids[id]}
  return t;
}

function updateBuildings(dt){
  globalPowerGen=0;globalPowerUse=0;globalPowerCap=0;
  dayNight=0.5+0.5*Math.sin(performance.now()/60000); // slow day/night

  for(let y=0;y<MAP_SIZE;y++)for(let x=0;x<MAP_SIZE;x++){
    const b=buildMap[y][x];if(!b||b.type==='part')continue;
    const def=BUILDING_DEFS[b.type];if(!def)continue;

    // power tracking
    if(def.powerCap)globalPowerCap+=def.powerCap;
    if(def.powerGen){
      let gen=def.powerGen;
      if(b.type===BTYPE.SOLAR||b.type===BTYPE.LARGE_SOLAR)gen*=Math.max(0.05,dayNight);
      if(b.type===BTYPE.THERMAL_GEN){
        const cov=countCoverage(x,y,def.size,(tx,ty)=>map[ty]?.[tx]===BLOCK.HOT);
        gen*=cov.ratio||0;
      }
      globalPowerGen+=gen;
    }
    if(def.powerUse)globalPowerUse+=def.powerUse;

    // drills
    if(def.mine){
      let rateMul=1;
      if(def.boostWater&&(b.liquids?.water||0)>=def.boostWater*dt){
        takeLiquid(b,'water',def.boostWater*dt);
        rateMul=def.boostMul||1;
      }
      for(const [res,baseRate] of Object.entries(def.mine)){
        let tiles=0;
        for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++){
          const tx=x+dx,ty=y+dy;
          if(res==='sand'){
            if(map[ty]?.[tx]===BLOCK.FERTILE||oreMap[ty]?.[tx]===ORE.NONE&&map[ty]?.[tx]===BLOCK.DIRT)tiles++;
          }else{
            const oid=Object.entries(ORE_TO_ID).find(([,v])=>v===res)?.[0];
            if(oid&&oreMap[ty]?.[tx]===+oid)tiles++;
          }
        }
        if(tiles>0){
          const rate=baseRate*(tiles/(def.size*def.size))*rateMul;
          addItem(b,res,rate*dt);
        }
      }
    }

    // pumps
    if(def.pumpRate){
      let waterTiles=0;
      for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++)if(map[y+dy]?.[x+dx]===BLOCK.WATER)waterTiles++;
      if(waterTiles>0){
        const rate=def.pumpRate*(waterTiles/(def.size*def.size));
        addLiquid(b,'water',rate*dt);
      }
    }

    // water extractor
    if(b.type===BTYPE.WATER_EXTRACTOR){
      let fert=0;
      for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++)if(map[y+dy]?.[x+dx]===BLOCK.FERTILE)fert++;
      if(fert>0)addLiquid(b,'water',6.6*(fert/(def.size*def.size))*dt);
    }

    // oil extractor
    if(b.type===BTYPE.OIL_EXTRACTOR){
      let fert=0;
      for(let dy=0;dy<def.size;dy++)for(let dx=0;dx<def.size;dx++)if(map[y+dy]?.[x+dx]===BLOCK.FERTILE)fert++;
      if(fert>0&&(b.items.sand||0)>=1&&(b.liquids?.water||0)>=9*dt){
        takeItem(b,'sand',1*dt); // approx
        takeLiquid(b,'water',9*dt);
        addLiquid(b,'oil',15*(fert/(def.size*def.size))*dt);
      }
    }

    // cultivator
    if(b.type===BTYPE.CULTIVATOR){
      if((b.liquids?.water||0)>=18*dt){
        takeLiquid(b,'water',18*dt);
        b.progress=(b.progress||0)+dt;
        if(b.progress>=1.666){b.progress=0;addItem(b,'spore',1)}
      }
    }

    // recipes
    if(def.recipe){
      const r=def.recipe;
      let can=true;
      for(const [id,need] of Object.entries(r.in)){
        const isLiq=RESOURCES.find(rr=>rr.id===id)?.liquid;
        if(isLiq){if((b.liquids?.[id]||0)<need*dt*0.5&&(b.liquids?.[id]||0)<need)can=false}
        else{if((b.items?.[id]||0)<need)can=false}
      }
      if(can){
        b.progress=(b.progress||0)+dt;
        if(b.progress>=r.time){
          b.progress=0;
          for(const [id,need] of Object.entries(r.in)){
            const isLiq=RESOURCES.find(rr=>rr.id===id)?.liquid;
            if(isLiq)takeLiquid(b,id,need);else takeItem(b,id,need);
          }
          for(const [id,amt] of Object.entries(r.out)){
            const isLiq=RESOURCES.find(rr=>rr.id===id)?.liquid;
            if(isLiq)addLiquid(b,id,amt);else addItem(b,id,amt);
          }
        }
      }
    }
  }
  globalPower=Math.min(globalPowerCap,Math.max(0,globalPower+(globalPowerGen-globalPowerUse)*dt));
}

function update(dt){
  // ship physics simple
  // camera home
  const cx=(camera.x+VIEW_W/2)/TILE,cy=(camera.y+VIEW_H/2)/TILE;
  const dx=ship.x-cx,dy=ship.y-cy;
  camera.targetX+=dx*TILE*0.08;
  camera.targetY+=dy*TILE*0.08;
  camera.x+=(camera.targetX-camera.x)*0.15;
  camera.y+=(camera.targetY-camera.y)*0.15;
  const maxX=MAP_SIZE*TILE-VIEW_W,maxY=MAP_SIZE*TILE-VIEW_H;
  camera.x=Math.max(0,Math.min(maxX,camera.x));
  camera.y=Math.max(0,Math.min(maxY,camera.y));

  updateBuildings(dt);
}

// === DRAW ===
function drawIcon(x,y,size,type,color){
  ctx.fillStyle=color;
  if(type==='liquid'){ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.fill()}
  else{ctx.fillRect(x-size/2,y-size/2,size,size)}
}
function drawDirArrow(cx,cy,d,alpha=1){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(d*Math.PI/2);ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawLiquidCounters(){
  const liquids=['water','slag','oil','cryo'];
  const names={water:'Вода',slag:'Шлак',oil:'Нефть',cryo:'Крио'};
  const colors={water:'#4da6ff',slag:'#ff6a00',oil:'#2a1a0a',cryo:'#6ef0ff'};
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,40,148,liquids.length*18+8);
  liquids.forEach((id,i)=>{
    const v=Math.floor(coreInventory[id]||0);
    ctx.fillStyle=colors[id];ctx.fillRect(12,46+i*18,10,10);
    ctx.fillStyle='#ccc';ctx.font='11px system-ui';ctx.textAlign='left';
    ctx.fillText(names[id]+': '+v,26,55+i*18);
  });
}
function drawBuildMenu(){
  const menuBottom=VIEW_H-10,modeY=menuBottom-BTN_H,modeX=VIEW_W-14-BTN_W;
  // mode
  ctx.fillStyle=buildMode==='delete'?'#a03030':'#305030';
  ctx.fillRect(modeX,modeY,BTN_W,BTN_H);
  ctx.strokeStyle='#fff';ctx.strokeRect(modeX,modeY,BTN_W,BTN_H);
  ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';
  ctx.fillText(buildMode==='delete'?'СНОС':'СТРОЙ',modeX+BTN_W/2,modeY+28);
  // confirm
  const leftX=modeX-BTN_W-GAP;
  if(hasPending()){
    ctx.fillStyle=buildMode==='delete'?'#c04040':'#40a040';
    ctx.fillRect(leftX,modeY,BTN_W,BTN_H);
    ctx.strokeStyle='#fff';ctx.strokeRect(leftX,modeY,BTN_W,BTN_H);
    ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.fillText('✓',leftX+BTN_W/2,modeY+28);
  }
  // rotate
  if(buildMode==='place'&&selectedBlock&&BUILDING_DEFS[selectedBlock]?.directional){
    ctx.fillStyle='#404060';ctx.fillRect(leftX,modeY-BTN_H-GAP,BTN_W,BTN_H);
    ctx.strokeStyle='#aaa';ctx.strokeRect(leftX,modeY-BTN_H-GAP,BTN_W,BTN_H);
    ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.fillText(DIR_ARROW[selectedDir],leftX+BTN_W/2,modeY-BTN_H-GAP+28);
  }
  // categories
  for(let i=0;i<CATEGORIES.length;i++){
    const col=i%3,row=Math.floor(i/3);
    const bx=VIEW_W-14-(2-col)*(BTN_W+GAP);
    const by=menuBottom-BTN_H*2-GAP*2-(1-row)*(BTN_H+GAP);
    const cat=CATEGORIES[i];
    const active=selectedBlock!=null&&cat.blocks.includes(selectedBlock);
    ctx.fillStyle=active?'#4a3a20':'#2a2a3a';
    ctx.fillRect(bx,by,BTN_W,BTN_H);
    ctx.strokeStyle=active?'#ffcc66':'#555';ctx.strokeRect(bx,by,BTN_W,BTN_H);
    ctx.fillStyle=active?'#ffcc66':'#aaa';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(cat.name.slice(0,6),bx+BTN_W/2,by+24);
  }
}
function drawBlockInfo(){
  if(!showBlockInfo||!infoBlock)return;
  const def=BUILDING_DEFS[infoBlock];if(!def)return;
  const lines=[def.name,def.desc||''];
  if(def.itemCap)lines.push(`Предметы: ${def.itemCap}`);
  if(def.liqCap)lines.push(`Жидкости: ${def.liqCap}`);
  if(def.powerUse)lines.push(`Энергия: -${def.powerUse}/с`);
  if(def.powerGen)lines.push(`Генерация: +${def.powerGen}/с`);
  if(def.powerCap)lines.push(`Ёмкость энергии: ${def.powerCap}`);
  if(def.mine)lines.push('Добыча: '+Object.entries(def.mine).map(([k,v])=>k+':'+v).join(', '));
  if(def.recipe)lines.push('Рецепт: '+JSON.stringify(def.recipe.in)+' → '+JSON.stringify(def.recipe.out)+' /'+def.recipe.time+'с');
  if(def.pumpRate)lines.push(`Насос: ${def.pumpRate}/с`);
  if(def.boostWater)lines.push(`Буст водой: x${def.boostMul} (${def.boostWater}/с)`);
  const pad=8,w=Math.min(280,VIEW_W-20),h=lines.length*16+pad*2;
  const px=12,py=50;
  ctx.fillStyle='rgba(15,15,30,.95)';ctx.fillRect(px,py,w,h);
  ctx.strokeStyle='#6ab0ff';ctx.strokeRect(px,py,w,h);
  ctx.font='11px system-ui';
  lines.forEach((ln,i)=>{
    ctx.fillStyle=i===0?'#ffcc66':i===1?'#aaa':'#ccc';
    ctx.fillText(ln.slice(0,50),px+pad,py+pad+12+i*16);
  });
}
function drawCoreInv(){
  if(!showCoreInv)return;
  const panelW=Math.min(220,VIEW_W*.42),rowH=22,pad=8,titleH=20;
  const coreItems=RESOURCES.filter(r=>(coreInventory[r.id]||0)>0);
  const coreH=titleH+Math.max(1,coreItems.length)*rowH+pad*2;
  const sx=core.x*TILE-camera.x,sy=core.y*TILE-camera.y;
  let px=sx+30,py=sy-coreH/2;
  if(px+panelW>VIEW_W-10)px=sx-panelW-10;
  if(py<50)py=50;if(py+coreH>VIEW_H-120)py=VIEW_H-120-coreH;
  ctx.fillStyle='rgba(15,15,25,.92)';ctx.fillRect(px,py,panelW,coreH);
  ctx.strokeStyle='rgba(100,180,255,.6)';ctx.lineWidth=1.5;ctx.strokeRect(px,py,panelW,coreH);
  ctx.fillStyle='#6ab0ff';ctx.font='bold 11px system-ui';ctx.fillText('ЯДРО',px+pad,py+14);
  if(!coreItems.length){ctx.fillStyle='#555';ctx.font='10px system-ui';ctx.fillText('пусто',px+pad,py+titleH+12)}
  else coreItems.forEach((res,i)=>{const ry=py+titleH+pad+i*rowH;drawIcon(px+pad+8,ry+rowH/2-1,11,res.icon,res.color);ctx.fillStyle='#ccc';ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText(res.name,px+pad+20,ry+13);ctx.fillStyle=res.liquid?'#6ef':'#8cf';ctx.textAlign='right';ctx.fillText(String(Math.floor(coreInventory[res.id])),px+panelW-pad,ry+13);ctx.textAlign='left'});
}
function draw(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const sTX=Math.max(0,Math.floor(camera.x/TILE)-1),sTY=Math.max(0,Math.floor(camera.y/TILE)-1);
  const eTX=Math.min(MAP_SIZE,Math.ceil((camera.x+VIEW_W)/TILE)+1),eTY=Math.min(MAP_SIZE,Math.ceil((camera.y+VIEW_H)/TILE)+1);

  for(let y=sTY;y<eTY;y++)for(let x=sTX;x<eTX;x++){
    const type=map[y][x],ore=oreMap[y][x],sx=x*TILE-camera.x,sy=y*TILE-camera.y;
    if(type===BLOCK.CORE){
      ctx.fillStyle='#1a1a2e';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      ctx.fillStyle='#3a3a5c';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
      if(x===core.x&&y===core.y){ctx.fillStyle='#6ab0ff';ctx.beginPath();ctx.arc(sx+TILE/2,sy+TILE/2,4,0,Math.PI*2);ctx.fill()}
    }else if(type===BLOCK.HOT){
      ctx.fillStyle='#c44a1a';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      ctx.fillStyle='rgba(255,100,0,.3)';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
    }else{
      ctx.fillStyle=COLORS[type]||'#333';ctx.fillRect(sx,sy,TILE+.5,TILE+.5);
      if(type===BLOCK.FERTILE){ctx.fillStyle='rgba(80,120,40,.2)';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4)}
      if(type===BLOCK.WATER){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(sx+3,sy+3,4,4)}
    }
    if(ore!==ORE.NONE){ctx.fillStyle=ORE_COLORS[ore];ctx.globalAlpha=.85;ctx.fillRect(sx+1,sy+1,TILE-2,TILE-2);ctx.globalAlpha=1}

    const b=buildMap[y][x];
    if(b&&b.type!=='part'){
      const def=BUILDING_DEFS[b.type];
      if(def){
        ctx.fillStyle=def.color;ctx.globalAlpha=.9;
        ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.globalAlpha=1;
        if(def.directional)drawDirArrow(sx+TILE*def.size/2,sy+TILE*def.size/2,b.dir??0);
        const key=x+','+y;
        if(deleteSel.has(key)){
          ctx.strokeStyle='#ff2222';ctx.lineWidth=3;ctx.strokeRect(sx+.5,sy+.5,TILE*def.size-1,TILE*def.size-1);
          ctx.fillStyle='rgba(255,40,40,.25)';ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);
        }
        const itemCount=Object.values(b.items||{}).reduce((a,v)=>a+v,0);
        if(itemCount>0){ctx.fillStyle='#fff';ctx.font='9px system-ui';ctx.fillText(String(itemCount),sx+2,sy+10)}
      }
    }else if(b&&b.type==='part'){
      const key=b.parentX+','+b.parentY;
      if(deleteSel.has(key)){ctx.strokeStyle='#ff2222';ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,TILE-2,TILE-2);ctx.fillStyle='rgba(255,40,40,.2)';ctx.fillRect(sx+1,sy+1,TILE-2,TILE-2)}
    }
  }

  for(const g of ghosts){
    const def=BUILDING_DEFS[g.type];if(!def)continue;
    const sx=g.x*TILE-camera.x,sy=g.y*TILE-camera.y;
    ctx.fillStyle=def.color;ctx.globalAlpha=.4;ctx.fillRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.globalAlpha=1;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.strokeRect(sx+1,sy+1,TILE*def.size-2,TILE*def.size-2);ctx.setLineDash([]);
    if(def.directional)drawDirArrow(sx+TILE*def.size/2,sy+TILE*def.size/2,g.dir,.9);
  }

  // ship
  const ssx=ship.x*TILE-camera.x,ssy=ship.y*TILE-camera.y;
  ctx.save();ctx.translate(ssx,ssy);ctx.rotate(ship.angle);
  ctx.fillStyle='#6a6a6a';ctx.beginPath();ctx.moveTo(ship.size,0);ctx.lineTo(-ship.size*.7,-ship.size*.55);ctx.lineTo(-ship.size*.4,0);ctx.lineTo(-ship.size*.7,ship.size*.55);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.moveTo(ship.size*.85,0);ctx.lineTo(ship.size*.2,-ship.size*.25);ctx.lineTo(ship.size*.2,ship.size*.25);ctx.closePath();ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ship.size*.15,0,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffaa44';ctx.beginPath();ctx.arc(ship.size*.15,0,1.8,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(shipCargo.amount>0&&shipCargo.type){
    const res=RESOURCES.find(r=>r.id===shipCargo.type);
    if(res){ctx.fillStyle=res.color;ctx.beginPath();ctx.arc(ssx,ssy-18,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(String(shipCargo.amount),ssx,ssy-15)}
  }

  // power bar
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(8,VIEW_H-70,120,28);
  ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.fillText(`⚡ +${globalPowerGen.toFixed(0)} / -${globalPowerUse.toFixed(0)}`,12,VIEW_H-52);
  ctx.fillText(`🔋 ${globalPower.toFixed(0)}/${globalPowerCap.toFixed(0)}`,12,VIEW_H-38);

  drawLiquidCounters();
  drawCoreInv();
  drawBuildMenu();
  drawBlockInfo();

  ctx.fillStyle=buildMode==='delete'?'rgba(180,30,30,.75)':'rgba(40,40,20,.6)';
  ctx.fillRect(VIEW_W/2-70,8,140,22);
  ctx.fillStyle=buildMode==='delete'?'#faa':'#fc6';ctx.font='bold 12px system-ui';ctx.textAlign='center';
  ctx.fillText(buildMode==='delete'?'РЕЖИМ: СНОС':'РЕЖИМ: СТРОЙКА',VIEW_W/2,23);
  if(ghosts.length||deleteSel.size){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(VIEW_W/2-110,34,220,18);
    ctx.fillStyle=buildMode==='delete'?'#f88':'#8f8';ctx.font='11px system-ui';
    ctx.fillText((buildMode==='delete'?'К сносу: ':'Призраков: ')+(buildMode==='delete'?deleteSel.size:ghosts.length)+' → ✓',VIEW_W/2,47);
  }
  ctx.textAlign='left';
}

// pointer events
canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType!=='touch')return;e.preventDefault();handlePointerDown(e.clientX,e.clientY,e.pointerType==='touch'?'touch':'mouse')});
canvas.addEventListener('pointermove',e=>handlePointerMove(e.clientX,e.clientY));
canvas.addEventListener('pointerup',e=>handlePointerUp(e.clientX,e.clientY,e.pointerType==='touch'?'touch':'mouse'));
canvas.addEventListener('pointercancel',e=>delete pointers[e.pointerType==='touch'?'touch':'mouse']);
// keyboard
window.addEventListener('keydown',e=>{
  if(e.code==='KeyR'){selectedDir=(selectedDir+1)%4;if(ghosts.length)ghosts[ghosts.length-1].dir=selectedDir}
  if(e.code==='Escape'){ghosts=[];deleteSel.clear();showBlockInfo=false}
  if(e.code==='KeyQ'){showBlockInfo=!showBlockInfo;if(selectedBlock)infoBlock=selectedBlock}
});

let lastTime=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;update(dt);draw();requestAnimationFrame(loop)}
generateMap();spawnShip();requestAnimationFrame(loop);
</script>
</body>
